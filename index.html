<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft Web 3D</title>
    <link rel="stylesheet" href="style.css">

    <!-- Global Three.js Bundle -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- ES Module Map for src imports -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js"
        }
    }
    </script>
</head>
<body>
    <canvas id="game-canvas"></canvas>

    <div id="damage-flash"></div>
    <div id="underwater-tint"></div>
    <div id="crosshair">+</div>

    <div id="debug-info">
        <div id="debug-fps">FPS: 0</div>
        <div id="debug-pos">XYZ: 0.0 / 0.0 / 0.0</div>
        <div id="debug-block">Selected: Grass</div>
        <div id="debug-time">Time: Day</div>
    </div>

    <div id="hud-container">
        <div id="status-bars">
            <div id="health-bar"></div>
            <div id="bubble-bar"></div>
            <div id="hunger-bar"></div>
        </div>

        <div id="hotbar">
            <div class="hotbar-slot active" data-slot="0"></div>
            <div class="hotbar-slot" data-slot="1"></div>
            <div class="hotbar-slot" data-slot="2"></div>
            <div class="hotbar-slot" data-slot="3"></div>
            <div class="hotbar-slot" data-slot="4"></div>
            <div class="hotbar-slot" data-slot="5"></div>
            <div class="hotbar-slot" data-slot="6"></div>
            <div class="hotbar-slot" data-slot="7"></div>
            <div class="hotbar-slot" data-slot="8"></div>
        </div>
    </div>

    <!-- Start / Pause Screen -->
    <div id="pause-screen">
        <div class="menu-box">
            <h1>MINECRAFT</h1>
            <p>Click Play to Enter World</p>
            <button id="btn-play" class="mc-btn">Play</button>
            <button id="btn-singleplayer" class="mc-btn" style="display:none;">Singleplayer</button>
        </div>
    </div>

    <!-- 2x2 Crafting Inventory Modal -->
    <div id="inventory-screen" class="hidden">
        <div class="mc-modal-box">
            <div class="modal-header">
                <span>Crafting</span>
                <button id="btn-close-inv" class="btn-close">&times;</button>
            </div>
            <div class="craft-area-2x2">
                <div class="craft-grid-2x2">
                    <div class="inv-slot craft-in-2x2" data-cslot="0"></div>
                    <div class="inv-slot craft-in-2x2" data-cslot="1"></div>
                    <div class="inv-slot craft-in-2x2" data-cslot="2"></div>
                    <div class="inv-slot craft-in-2x2" data-cslot="3"></div>
                </div>
                <div class="craft-arrow">&rarr;</div>
                <div id="craft-out-2x2" class="inv-slot craft-result"></div>
            </div>
            <div class="inventory-section-title">Inventory</div>
            <div id="inv-main-grid-2x2" class="inv-grid-27"></div>
            <div id="inv-hotbar-grid-2x2" class="inv-grid-9"></div>
        </div>
    </div>

    <!-- 3x3 Crafting Table Modal -->
    <div id="crafting-table-screen" class="hidden">
        <div class="mc-modal-box wide">
            <div class="modal-header">
                <span>Crafting Table (3x3)</span>
                <button id="btn-close-table" class="btn-close">&times;</button>
            </div>
            <div class="craft-area-3x3">
                <div class="craft-grid-3x3">
                    <div class="inv-slot craft-in-3x3" data-tslot="0"></div>
                    <div class="inv-slot craft-in-3x3" data-tslot="1"></div>
                    <div class="inv-slot craft-in-3x3" data-tslot="2"></div>
                    <div class="inv-slot craft-in-3x3" data-tslot="3"></div>
                    <div class="inv-slot craft-in-3x3" data-tslot="4"></div>
                    <div class="inv-slot craft-in-3x3" data-tslot="5"></div>
                    <div class="inv-slot craft-in-3x3" data-tslot="6"></div>
                    <div class="inv-slot craft-in-3x3" data-tslot="7"></div>
                    <div class="inv-slot craft-in-3x3" data-tslot="8"></div>
                </div>
                <div class="craft-arrow">&rarr;</div>
                <div id="craft-out-3x3" class="inv-slot craft-result"></div>
            </div>
            <div class="inventory-section-title">Inventory</div>
            <div id="inv-main-grid-3x3" class="inv-grid-27"></div>
            <div id="inv-hotbar-grid-3x3" class="inv-grid-9"></div>
        </div>
    </div>

    <!-- Mobile Touch Controls -->
    <div id="mobile-controls">
        <div id="dpad">
            <button id="btn-up" class="touch-btn">&uarr;</button>
            <div class="dpad-middle">
                <button id="btn-left" class="touch-btn">&larr;</button>
                <button id="btn-down" class="touch-btn">&darr;</button>
                <button id="btn-right" class="touch-btn">&rarr;</button>
            </div>
        </div>
        <div id="action-buttons">
            <button id="btn-jump" class="touch-btn">Jump</button>
            <button id="btn-break" class="touch-btn">Break</button>
            <button id="btn-place" class="touch-btn">Place</button>
            <button id="btn-inv-mobile" class="touch-btn">Inv</button>
        </div>
    </div>

    <!-- Module Engine Bootstrapper -->
    <script type="module">
        import { Engine } from './src/core/Engine.js';
        window.addEventListener('DOMContentLoaded', () => {
            try {
                window.gameEngine = new Engine();
            } catch (err) {
                console.error("Critical Engine Launch Error:", err);
            }
        });
    </script>
</body>
</html>
