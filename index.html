    }

    message.innerText = text;
    message.style.opacity = "1";

    clearTimeout(part16MessageTimer);

    part16MessageTimer = setTimeout(function () {
      message.style.opacity = "0";
    }, 2200);
  }

  const blockList = [
    "grass",
    "dirt",
    "stone",
    "cobble",
    "wood",
    "plank",
    "leaves",
    "sand",
    "glass",
    "water",
    "lava",
    "obsidian",
    "glowstone",
    "sponge",
    "hay_bale",
    "coal_ore",
    "iron_ore",
    "gold_ore",
    "diamond_ore",
    "bedrock",
    "ladder",
    "flower_red",
    "flower_yellow",
    "tall_grass"
  ];

  const blockColors = {
    grass: "#58b54b",
    dirt: "#8a5a2b",
    stone: "#8f8f8f",
    cobble: "#7f7f7f",
    wood: "#7a4f21",
    plank: "#b58a4d",
    leaves: "#2f8f2f",
    sand: "#d8c37a",
    glass: "#bfe8ff",
    water: "#3b7fd4",
    lava: "#ff5a00",
    obsidian: "#241536",
    glowstone: "#ffd97a",
    sponge: "#d9c455",
    hay_bale: "#d6b23a",
    coal_ore: "#4a4a4a",
    iron_ore: "#d8af93",
    gold_ore: "#f2d23b",
    diamond_ore: "#59d8d0",
    bedrock: "#333333",
    ladder: "#a3793f",
    flower_red: "#e33b3b",
    flower_yellow: "#f2e23b",
    tall_grass: "#4f9e3c"
  };

  const blockNames = {
    grass: "گیا",
    dirt: "خاک",
    stone: "بەرد",
    cobble: "کۆبڵ",
    wood: "دار",
    plank: "تەختە",
    leaves: "گەڵا",
    sand: "خۆڵ",
    glass: "شووشە",
    water: "ئاو",
    lava: "لابا",
    obsidian: "ئۆبسیدیەن",
    glowstone: "گلۆستۆن",
    sponge: "سپۆنج",
    hay_bale: "کا",
    coal_ore: "خەڵووز",
    iron_ore: "ئاسن",
    gold_ore: "زێڕ",
    diamond_ore: "ئەڵماس",
    bedrock: "بێدڕۆک",
    ladder: "نەردەبان",
    flower_red: "گوڵی سوور",
    flower_yellow: "گوڵی زەرد",
    tall_grass: "گیای درێژ"
  };

  const defaultPart16Settings = {
    creativeMode: true,
    selectedBlock: "grass"
  };

  function loadPart16Settings() {
    const settingsCopy = Object.assign({}, defaultPart16Settings);

    try {
      const raw = localStorage.getItem(PART16_SETTINGS_KEY);

      if (raw) {
        const parsed = JSON.parse(raw);

        if (typeof parsed.creativeMode === "boolean") {
          settingsCopy.creativeMode = parsed.creativeMode;
        }

        if (
          typeof parsed.selectedBlock === "string" &&
          blockList.indexOf(parsed.selectedBlock) !== -1
        ) {
          settingsCopy.selectedBlock = parsed.selectedBlock;
        }
      }
    } catch (error) {}

    return settingsCopy;
  }

  function savePart16Settings() {
    try {
      localStorage.setItem(
        PART16_SETTINGS_KEY,
        JSON.stringify({
          creativeMode: creativeMode,
          selectedBlock: creativeSelectedBlock
        })
      );
    } catch (error) {}
  }

  const part16Settings = loadPart16Settings();

  let creativeMode = part16Settings.creativeMode;
  let creativeSelectedBlock = part16Settings.selectedBlock;
  let inventoryOpen = false;
  let suppressRaycast = false;

  if (blockList.indexOf(creativeSelectedBlock) === -1) {
    creativeSelectedBlock = "grass";
  }

  const originalRaycastBlocks =
    typeof raycastBlocks === "function" ? raycastBlocks : null;

  if (originalRaycastBlocks) {
    raycastBlocks = function () {
      if (suppressRaycast) {
        return [];
      }

      return originalRaycastBlocks();
    };
  }

  const inventoryOverlay = document.createElement("div");
  inventoryOverlay.id = "part16-inventory";

  inventoryOverlay.innerHTML = `
    <div id="part16-panel">
      <div id="part16-title">ئینڤێنتۆر</div>
      <div id="part16-grid"></div>

      <div id="part16-controls">
        <div id="part16-creative-row">
          <input id="part16-creative-checkbox" type="checkbox">
          <label for="part16-creative-checkbox">دۆخی داهێنان</label>
        </div>

        <button id="part16-close" class="part16-btn">داخستن</button>
      </div>
    </div>
  `;

  document.body.appendChild(inventoryOverlay);

  const inventoryGrid = document.getElementById("part16-grid");
  const creativeCheckbox = document.getElementById(
    "part16-creative-checkbox"
  );
  const closeBtn = document.getElementById("part16-close");

  function isPart15DeadNow() {
    const deathOverlay = document.getElementById("part7-death");

    return deathOverlay && deathOverlay.style.display === "flex";
  }

  function isPart15MenuVisible() {
    const menu = document.getElementById("part15-menu");

    return menu && menu.style.display !== "none";
  }

  function renderInventoryGrid() {
    inventoryGrid.innerHTML = "";

    blockList.forEach(function (type) {
      const item = document.createElement("button");
      item.className = "part16-item";
      item.style.background = blockColors[type] || "#888888";
      item.title = blockNames[type] || type;

      if (type === creativeSelectedBlock) {
        item.classList.add("selected");
      }

      item.addEventListener("click", function () {
        creativeSelectedBlock = type;
        creativeMode = true;
        creativeCheckbox.checked = true;

        currentBlock = type;

        savePart16Settings();
        renderInventoryGrid();
        closeInventory();
      });

      inventoryGrid.appendChild(item);
    });
  }

  function openInventory() {
    if (inventoryOpen) {
      return;
    }

    if (isPart15DeadNow()) {
      return;
    }

    if (isPart15MenuVisible()) {
      return;
    }

    if (document.pointerLockElement !== document.body) {
      return;
    }

    inventoryOpen = true;
    inventoryOverlay.style.display = "flex";

    creativeCheckbox.checked = creativeMode;
    renderInventoryGrid();

    if (document.pointerLockElement === document.body) {
      document.exitPointerLock();
    }
  }

  function closeInventory() {
    if (!inventoryOpen) {
      return;
    }

    inventoryOpen = false;
    inventoryOverlay.style.display = "none";

    if (creativeMode) {
      currentBlock = creativeSelectedBlock;
    } else {
      currentBlock = "grass";
    }

    if (document.pointerLockElement !== document.body) {
      document.body.requestPointerLock();
    }

    setTimeout(function () {
      if (document.pointerLockElement !== document.body) {
        const menu = document.getElementById("part15-menu");

        if (menu) {
          menu.style.display = "flex";
        }
      }
    }, 120);
  }

  inventoryOverlay.addEventListener("click", function (event) {
    if (event.target === inventoryOverlay) {
      closeInventory();
    }
  });

  closeBtn.addEventListener("click", function () {
    closeInventory();
  });

  creativeCheckbox.addEventListener("change", function () {
    creativeMode = this.checked;

    if (creativeMode) {
      currentBlock = creativeSelectedBlock;
      showPart16Message("دۆخی داهێنان چالاک کرا");
    } else {
      currentBlock = "grass";
      showPart16Message("دۆخی داهێنان کوژایەوە");
    }

    savePart16Settings();
  });

  window.addEventListener(
    "keydown",
    function (event) {
      if (inventoryOpen) {
        return;
      }

      if (isPart15DeadNow()) {
        return;
      }

      if (isPart15MenuVisible()) {
        return;
      }

      if (document.pointerLockElement !== document.body) {
        return;
      }

      if (event.code === "KeyE") {
        openInventory();
        event.stopImmediatePropagation();
        return;
      }

      if (event.code === "KeyG") {
        creativeMode = !creativeMode;

        if (creativeMode) {
          currentBlock = creativeSelectedBlock;
          showPart16Message("دۆخی داهێنان چالاک کرا");
        } else {
          currentBlock = "grass";
          showPart16Message("دۆخی داهێنان کوژایەوە");
        }

        savePart16Settings();
        event.stopImmediatePropagation();
      }
    },
    true
  );

  window.addEventListener(
    "pointerdown",
    function (event) {
      if (!creativeMode) {
        return;
      }

      if (inventoryOpen) {
        return;
      }

      if (document.pointerLockElement !== document.body) {
        return;
      }

      if (event.button === 0 || event.button === 2) {
        suppressRaycast = true;

        setTimeout(function () {
          suppressRaycast = false;
        }, 80);
      }
    },
    true
  );

  function directRemoveCreativeBlock(x, y, z) {
    const key = blockKey(x, y, z);
    const mesh = blocks.get(key);

    if (!mesh) {
      return;
    }

    scene.remove(mesh);
    blocks.delete(key);
  }

  window.addEventListener(
    "mousedown",
    function (event) {
      if (!creativeMode) {
        return;
      }

      if (inventoryOpen) {
        return;
      }

      if (document.pointerLockElement !== document.body) {
        return;
      }

      if (!originalRaycastBlocks) {
        return;
      }

      const intersects = originalRaycastBlocks();

      if (event.button === 0) {
        if (intersects.length > 0) {
          const data = intersects[0].object.userData;

          if (data && data.type === "bedrock") {
            directRemoveCreativeBlock(data.x, data.y, data.z);
          } else if (data) {
            removeBlock(data.x, data.y, data.z);
          }
        }
      }

      if (event.button === 2) {
        if (intersects.length > 0) {
          const hit = intersects[0];
          const data = hit.object.userData;
          const normal = hit.face.normal;

          if (data && normal) {
            const x = data.x + Math.round(normal.x);
            const y = data.y + Math.round(normal.y);
            const z = data.z + Math.round(normal.z);

            const key = blockKey(x, y, z);

            if (!blocks.has(key)) {
              let blockedByPlayer = false;

              if (typeof blockIntersectsPlayer === "function") {
                blockedByPlayer = blockIntersectsPlayer(x, y, z);
              }

              if (!blockedByPlayer) {
                addBlock(x, y, z, creativeSelectedBlock);
              }
            }
          }
        }
      }

      suppressRaycast = false;
    },
    true
  );

  let lastSeenCurrentBlock = currentBlock;

  const part16Clock = new THREE.Clock();

  function part16Loop() {
    requestAnimationFrame(part16Loop);

    part16Clock.getDelta();

    if (inventoryOpen) {
      const menu = document.getElementById("part15-menu");

      if (menu && menu.style.display !== "none") {
        menu.style.display = "none";
      }
    }

    if (creativeMode && currentBlock !== lastSeenCurrentBlock) {
      if (blockList.indexOf(currentBlock) !== -1) {
        creativeSelectedBlock = currentBlock;
      }

      lastSeenCurrentBlock = currentBlock;
    }

    if (!creativeMode) {
      lastSeenCurrentBlock = currentBlock;
    }
  }

  if (creativeMode) {
    currentBlock = creativeSelectedBlock;
  }

  part16Loop();

  showPart16Message(
    "Part 16: ئینڤێنتۆری داهێنان زیادکرا — E و G"
  );
})();
</script>
<script>
(function () {
  if (typeof scene === "undefined" || typeof blocks === "undefined") {
    console.error("Part 17: سەرەتا دەبێت Part 1 هەبێت.");
    return;
  }

  if (window.__minicraftPart17Loaded) {
    return;
  }

  window.__minicraftPart17Loaded = true;

  const MAIN_SAVE_KEY = "minicraft_save_v1";
  const SLOT_COUNT = 5;

  const style = document.createElement("style");
  style.textContent = `
    #mc-message {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.65);
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      z-index: 30;
      opacity: 0;
      transition: opacity 0.25s;
      direction: rtl;
      font-size: 14px;
      pointer-events: none;
      text-align: center;
    }

    #part17-worlds {
      position: fixed;
      inset: 0;
      z-index: 55;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      direction: rtl;
      font-family: Arial, sans-serif;
    }

    #part17-panel {
      width: 560px;
      max-width: 94vw;
      background: rgba(20, 20, 20, 0.9);
      border: 3px solid #000;
      padding: 16px;
      box-sizing: border-box;
      color: white;
    }

    #part17-title {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 14px;
      text-shadow: 1px 1px 0 #000;
    }

    .part17-slot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid #000;
      padding: 8px;
      margin-bottom: 8px;
    }

    .part17-slot-info {
      font-size: 14px;
      direction: rtl;
      flex: 1;
    }

    .part17-slot-buttons {
      display: flex;
      gap: 6px;
      direction: ltr;
    }

    .part17-small {
      padding: 6px 9px;
      background: #6f6f6f;
      border: 2px solid #000;
      color: white;
      cursor: pointer;
      font-size: 12px;
      text-shadow: 1px 1px 0 #000;
    }

    .part17-small:hover {
      background: #7f8cff;
    }

    .part17-small:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #part17-close {
      width: 100%;
      margin-top: 10px;
      padding: 9px;
      background: #6f6f6f;
      border: 2px solid #000;
      color: white;
      cursor: pointer;
      font-size: 16px;
      text-shadow: 1px 1px 0 #000;
    }

    #part17-close:hover {
      background: #7f8cff;
    }
  `;

  document.head.appendChild(style);

  let part17MessageTimer = null;

  function showPart17Message(text) {
    let message = document.getElementById("mc-message");

    if (!message) {
      message = document.createElement("div");
      message.id = "mc-message";
      document.body.appendChild(message);
    }

    message.innerText = text;
    message.style.opacity = "1";

    clearTimeout(part17MessageTimer);

    part17MessageTimer = setTimeout(function () {
      message.style.opacity = "0";
    }, 2200);
  }

  function getSlotKey(index) {
    return "minicraft_world_slot_" + index;
  }

  function getSlotInfoKey(index) {
    return "minicraft_world_slot_info_" + index;
  }

  function isPart15MenuVisible() {
    const menu = document.getElementById("part15-menu");

    return menu && menu.style.display !== "none";
  }

  function collectCurrentWorldData() {
    const data = {
      version: 1,
      player: {
        x: player.x,
        y: player.y,
        z: player.z
      },
      yaw: yaw,
      pitch: pitch,
      blocks: []
    };

    blocks.forEach(function (mesh) {
      if (!mesh || !mesh.userData) {
        return;
      }

      const blockData = {
        x: mesh.userData.x,
        y: mesh.userData.y,
        z: mesh.userData.z,
        type: mesh.userData.type
      };

      if (mesh.userData.type === "water") {
        blockData.level = mesh.userData.level || 0;
      }

      data.blocks.push(blockData);
    });

    return data;
  }

  function getSlotInfo(index) {
    try {
      const infoRaw = localStorage.getItem(getSlotInfoKey(index));

      if (infoRaw) {
        return JSON.parse(infoRaw);
      }

      const dataRaw = localStorage.getItem(getSlotKey(index));

      if (dataRaw) {
        const data = JSON.parse(dataRaw);

        return {
          blockCount: data.blocks ? data.blocks.length : 0,
          date: Date.now()
        };
      }
    } catch (error) {}

    return null;
  }

  function saveCurrentWorldToSlot(index) {
    try {
      const data = collectCurrentWorldData();

      localStorage.setItem(getSlotKey(index), JSON.stringify(data));

      localStorage.setItem(
        getSlotInfoKey(index),
        JSON.stringify({
          blockCount: data.blocks.length,
          date: Date.now()
        })
      );

      showPart17Message("جیهان لە سلۆتی " + index + " پاشەکەوت کرا");
      renderWorldList();
    } catch (error) {
      showPart17Message("هەڵە لە پاشەکەوتکردن");
    }
  }

  function playSlot(index) {
    try {
      const raw = localStorage.getItem(getSlotKey(index));

      if (!raw) {
        return;
      }

      localStorage.setItem(MAIN_SAVE_KEY, raw);

      closeWorlds();

      const enterBtn = document.getElementById("part15-btn-enter");

      if (enterBtn && !enterBtn.disabled) {
        enterBtn.click();
      } else {
        showPart17Message("چاوەڕوان بکە");
      }
    } catch (error) {
      showPart17Message("هەڵە لە بارکردنی سلۆت");
    }
  }

  function deleteSlot(index) {
    try {
      localStorage.removeItem(getSlotKey(index));
      localStorage.removeItem(getSlotInfoKey(index));

      showPart17Message("سلۆتی " + index + " سڕایەوە");
      renderWorldList();
    } catch (error) {}
  }

  const worldsOverlay = document.createElement("div");
  worldsOverlay.id = "part17-worlds";

  worldsOverlay.innerHTML = `
    <div id="part17-panel">
      <div id="part17-title">جیهانەکان</div>
      <div id="part17-list"></div>
      <button id="part17-close">داخستن</button>
    </div>
  `;

  document.body.appendChild(worldsOverlay);

  const worldList = document.getElementById("part17-list");
  const closeWorldsBtn = document.getElementById("part17-close");

  function openWorlds() {
    const enterBtn = document.getElementById("part15-btn-enter");

    if (enterBtn && enterBtn.disabled) {
      return;
    }

    worldsOverlay.style.display = "flex";
    renderWorldList();
  }

  function closeWorlds() {
    worldsOverlay.style.display = "none";
  }

  function renderWorldList() {
    worldList.innerHTML = "";

    for (let i = 1; i <= SLOT_COUNT; i++) {
      const slotInfo = getSlotInfo(i);

      const row = document.createElement("div");
      row.className = "part17-slot";

      const info = document.createElement("div");
      info.className = "part17-slot-info";

      if (slotInfo) {
        let dateString = "";

        try {
          dateString = new Date(slotInfo.date || Date.now()).toLocaleString();
        } catch (error) {
          dateString = "";
        }

        info.innerText =
          "سلۆتی " +
          i +
          " — بلۆک: " +
          (slotInfo.blockCount || 0) +
          (dateString ? " — " + dateString : "");
      } else {
        info.innerText = "سلۆتی " + i + " — بەتاڵ";
      }

      const buttons = document.createElement("div");
      buttons.className = "part17-slot-buttons";

      const playBtn = document.createElement("button");
      playBtn.className = "part17-small";
      playBtn.innerText = "یاری";
      playBtn.disabled = !slotInfo;

      playBtn.addEventListener("click", function () {
        playSlot(i);
      });

      const saveBtn = document.createElement("button");
      saveBtn.className = "part17-small";
      saveBtn.innerText = "پاشەکەوت";

      saveBtn.addEventListener("click", function () {
        saveCurrentWorldToSlot(i);
      });

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "part17-small";
      deleteBtn.innerText = "سڕینەوە";
      deleteBtn.disabled = !slotInfo;

      deleteBtn.addEventListener("click", function () {
        deleteSlot(i);
      });

      buttons.appendChild(playBtn);
      buttons.appendChild(saveBtn);
      buttons.appendChild(deleteBtn);

      row.appendChild(info);
      row.appendChild(buttons);

      worldList.appendChild(row);
    }
  }

  closeWorldsBtn.addEventListener("click", function () {
    closeWorlds();
  });

  worldsOverlay.addEventListener("click", function (event) {
    if (event.target === worldsOverlay) {
      closeWorlds();
    }
  });

  window.addEventListener(
    "keyup",
    function (event) {
      if (event.code === "Escape" && worldsOverlay.style.display === "flex") {
        closeWorlds();
      }
    },
    true
  );

  const part15MainButtons = document.getElementById("part15-main-buttons");
  const part15SettingsBtn = document.getElementById("part15-btn-settings");

  let worldsBtn = null;

  if (part15MainButtons) {
    worldsBtn = document.createElement("button");
    worldsBtn.id = "part17-worlds-btn";
    worldsBtn.className = "part15-btn";
    worldsBtn.innerText = "جیهانەکان";

    if (part15SettingsBtn) {
      part15MainButtons.insertBefore(worldsBtn, part15SettingsBtn);
    } else {
      part15MainButtons.appendChild(worldsBtn);
    }

    worldsBtn.addEventListener("click", function () {
      openWorlds();
    });
  }

  const part17Clock = new THREE.Clock();

  function part17Loop() {
    requestAnimationFrame(part17Loop);

    part17Clock.getDelta();

    if (worldsBtn) {
      const enterBtn = document.getElementById("part15-btn-enter");

      if (enterBtn) {
        worldsBtn.disabled = enterBtn.disabled;
      }
    }

    if (worldsOverlay.style.display === "flex") {
      const enterBtn = document.getElementById("part15-btn-enter");

      if (enterBtn && enterBtn.disabled) {
        closeWorlds();
      }

      if (document.pointerLockElement === document.body) {
        closeWorlds();
      }
    }
  }

  part17Loop();

  showPart17Message(
    "Part 17: سلۆتی جیهانەکان زیادکرا — لە مێنیوەکە 'جیهانەکان' بکە"
  );
})();
</script>

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(255,255,255,0.08);
      border: 2px solid #000;
      padding: 8px;
      margin-bottom: 8px;
    }

    .part18-recipe-info {
      flex: 1;
      font-size: 14px;
      line-height: 1.5;
    }

    .part18-btn {
      padding: 7px 12px;
      background: #6f6f6f;
      border: 2px solid #000;
      color: white;
      cursor: pointer;
      text-shadow: 1px 1px 0 #000;
    }

    .part18-btn:hover {
      background: #7f8cff;
    }

    .part18-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #part18-close {
      width: 100%;
      margin-top: 10px;
      padding: 9px;
      font-size: 16px;
    }

    #part18-stock {
      background: rgba(0,0,0,0.25);
      padding: 8px;
      border: 2px solid rgba(0,0,0,0.6);
      margin-bottom: 10px;
      font-size: 13px;
      line-height: 1.6;
    }

    #part18-mini-hud {
      position: fixed;
      left: 10px;
      bottom: 10px;
      z-index: 26;
      color: white;
      direction: rtl;
      background: rgba(0,0,0,0.35);
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 13px;
      pointer-events: none;
      text-shadow: 0 0 3px black;
    }
  `;

  document.head.appendChild(style);

  let part18MessageTimer = null;

  function showPart18Message(text) {
    let message = document.getElementById("mc-message");

    if (!message) {
      message = document.createElement("div");
      message.id = "mc-message";
      document.body.appendChild(message);
    }

    message.innerText = text;
    message.style.opacity = "1";

    clearTimeout(part18MessageTimer);

    part18MessageTimer = setTimeout(function () {
      message.style.opacity = "0";
    }, 2200);
  }

  function makePixelTexture(draw) {
    const canvas = document.createElement("canvas");
    canvas.width = 16;
    canvas.height = 16;

    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    draw(ctx);

    const texture = new THREE.CanvasTexture(canvas);
    texture.magFilter = THREE.NearestFilter;
    texture.minFilter = THREE.NearestFilter;
    texture.generateMipmaps = false;

    return texture;
  }

  function randomChoice(list) {
    return list[Math.floor(Math.random() * list.length)];
  }

  function drawCrafting(ctx) {
    const colors = ["#9b6a3a", "#b58a4d", "#7a4f21", "#c09657"];

    for (let x = 0; x < 16; x++) {
      for (let y = 0; y < 16; y++) {
        ctx.fillStyle = randomChoice(colors);
        ctx.fillRect(x, y, 1, 1);
      }
    }

    ctx.fillStyle = "#5d3f1f";
    ctx.fillRect(0, 0, 16, 1);
    ctx.fillRect(0, 15, 16, 1);
    ctx.fillRect(0, 0, 1, 16);
    ctx.fillRect(15, 0, 1, 16);

    ctx.fillStyle = "#3b2814";
    ctx.fillRect(4, 0, 1, 16);
    ctx.fillRect(11, 0, 1, 16);
    ctx.fillRect(0, 4, 16, 1);
    ctx.fillRect(0, 11, 16, 1);
  }

  function drawFurnace(ctx) {
    const colors = ["#5d5d5d", "#747474", "#8a8a8a", "#4b4b4b"];

    for (let x = 0; x < 16; x++) {
      for (let y = 0; y < 16; y++) {
        ctx.fillStyle = randomChoice(colors);
        ctx.fillRect(x, y, 1, 1);
      }
    }

    ctx.fillStyle = "#1a1a1a";
    ctx.fillRect(4, 4, 8, 5);

    ctx.fillStyle = "#ff7a00";
    ctx.fillRect(5, 10, 6, 3);

    ctx.fillStyle = "#ffd24a";
    ctx.fillRect(6, 10, 3, 2);

    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fillRect(0, 0, 16, 1);
    ctx.fillRect(0, 15, 16, 1);
    ctx.fillRect(0, 0, 1, 16);
    ctx.fillRect(15, 0, 1, 16);
  }

  function drawTorch(ctx) {
    ctx.clearRect(0, 0, 16, 16);

    ctx.fillStyle = "#7a4f21";
    ctx.fillRect(7, 5, 2, 11);

    ctx.fillStyle = "#ff5a00";
    ctx.fillRect(6, 2, 4, 4);

    ctx.fillStyle = "#ffd24a";
    ctx.fillRect(7, 1, 2, 3);

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(8, 2, 1, 1);
  }

  if (!materials.crafting_table) {
    materials.crafting_table = new THREE.MeshLambertMaterial({
      map: makePixelTexture(drawCrafting)
    });
  }

  if (!materials.furnace) {
    materials.furnace = new THREE.MeshLambertMaterial({
      map: makePixelTexture(drawFurnace)
    });
  }

  if (!materials.torch) {
    materials.torch = new THREE.MeshBasicMaterial({
      map: makePixelTexture(drawTorch),
      transparent: true,
      alphaTest: 0.2,
      side: THREE.DoubleSide
    });
  }

  const part18NonSolid = {
    water: true,
    lava: true,
    flower_red: true,
    flower_yellow: true,
    tall_grass: true,
    ladder: true,
    torch: true
  };

  const previousGetColliding =
    typeof getCollidingBlock === "function" ? getCollidingBlock : null;

  getCollidingBlock = function (px, py, pz) {
    const half = 0.3;
    const height = 1.8;

    const minX = px - half;
    const maxX = px + half;
    const minY = py;
    const maxY = py + height;
    const minZ = pz - half;
    const maxZ = pz + half;

    const startX = Math.floor(minX - 0.5);
    const endX = Math.ceil(maxX + 0.5);

    const startY = Math.floor(minY - 0.5);
    const endY = Math.ceil(maxY + 0.5);

    const startZ = Math.floor(minZ - 0.5);
    const endZ = Math.ceil(maxZ + 0.5);

    for (let x = startX; x <= endX; x++) {
      for (let y = startY; y <= endY; y++) {
        for (let z = startZ; z <= endZ; z++) {
          const mesh = blocks.get(blockKey(x, y, z));

          if (!mesh) {
            continue;
          }

          if (part18NonSolid[mesh.userData.type]) {
            continue;
          }

          const blockMinX = x - 0.5;
          const blockMaxX = x + 0.5;
          const blockMinY = y - 0.5;
          const blockMaxY = y + 0.5;
          const blockMinZ = z - 0.5;
          const blockMaxZ = z + 0.5;

          if (
            blockMaxX > minX &&
            blockMinX < maxX &&
            blockMaxY > minY &&
            blockMinY < maxY &&
            blockMaxZ > minZ &&
            blockMinZ < maxZ
          ) {
            return { x: x, y: y, z: z };
          }
        }
      }
    }

    return null;
  };

  collides = function (px, py, pz) {
    return getCollidingBlock(px, py, pz) !== null;
  };

  const defaultItems = {
    plank: 8,
    cobble: 8,
    coal_ore: 3,
    iron_ore: 0,
    iron_ingot: 0,
    gold_ore: 0,
    gold_ingot: 0,
    torch: 4,
    crafting_table: 1,
    furnace: 1,
    glass: 2,
    sand: 4
  };

  function loadItems() {
    const data = Object.assign({}, defaultItems);

    try {
      const raw = localStorage.getItem(PART18_KEY);

      if (raw) {
        const parsed = JSON.parse(raw);

        for (const key in parsed) {
          if (typeof parsed[key] === "number") {
            data[key] = parsed[key];
          }
        }
      }
    } catch (error) {}

    return data;
  }

  let items = loadItems();

  function saveItems() {
    try {
      localStorage.setItem(PART18_KEY, JSON.stringify(items));
    } catch (error) {}
  }

  function itemCount(type) {
    return items[type] || 0;
  }

  function addItem(type, amount) {
    if (!items[type]) {
      items[type] = 0;
    }

    items[type] += amount;

    if (items[type] < 0) {
      items[type] = 0;
    }

    saveItems();
    updateMiniHud();
  }

  function canPay(cost) {
    for (const key in cost) {
      if (itemCount(key) < cost[key]) {
        return false;
      }
    }

    return true;
  }

  function pay(cost) {
    if (!canPay(cost)) {
      return false;
    }

    for (const key in cost) {
      addItem(key, -cost[key]);
    }

    return true;
  }

  function give(result) {
    for (const key in result) {
      addItem(key, result[key]);
    }
  }

  function humanName(type) {
    const names = {
      plank: "تەختە",
      cobble: "کۆبڵ",
      coal_ore: "خەڵووز",
      iron_ore: "کانزای ئاسن",
      iron_ingot: "ئاسنی تاوێنراو",
      gold_ore: "کانزای زێڕ",
      gold_ingot: "زێڕی تاوێنراو",
      torch: "مەشخەڵ",
      crafting_table: "مێزی دروستکردن",
      furnace: "فڕن",
      glass: "شووشە",
      sand: "خۆڵ"
    };

    return names[type] || type;
  }

  function costText(cost) {
    const parts = [];

    for (const key in cost) {
      parts.push(humanName(key) + " × " + cost[key]);
    }

    return parts.join(" + ");
  }

  function resultText(result) {
    const parts = [];

    for (const key in result) {
      parts.push(humanName(key) + " × " + result[key]);
    }

    return parts.join(" + ");
  }

  const craftingRecipes = [
    {
      name: "مەشخەڵ",
      cost: { coal_ore: 1, plank: 1 },
      result: { torch: 4 }
    },
    {
      name: "فڕن",
      cost: { cobble: 8 },
      result: { furnace: 1 }
    },
    {
      name: "مێزی دروستکردن",
      cost: { plank: 4 },
      result: { crafting_table: 1 }
    },
    {
      name: "تەختە لە دار",
      cost: { plank: 1 },
      result: { plank: 4 }
    }
  ];

  const furnaceRecipes = [
    {
      name: "تاوکردنی ئاسن",
      cost: { iron_ore: 1, coal_ore: 1 },
      result: { iron_ingot: 1 }
    },
    {
      name: "تاوکردنی زێڕ",
      cost: { gold_ore: 1, coal_ore: 1 },
      result: { gold_ingot: 1 }
    },
    {
      name: "دروستکردنی شووشە",
      cost: { sand: 1, coal_ore: 1 },
      result: { glass: 1 }
    }
  ];

  const panel = document.createElement("div");
  panel.id = "part18-panel";

  panel.innerHTML = `
    <div id="part18-box">
      <div id="part18-title">Crafting</div>
      <div id="part18-tabs">
        <button id="part18-tab-craft" class="part18-tab active">Crafting</button>
        <button id="part18-tab-furnace" class="part18-tab">Furnace</button>
      </div>
      <div id="part18-stock"></div>
      <div id="part18-content"></div>
      <button id="part18-close" class="part18-btn">داخستن</button>
    </div>
  `;

  document.body.appendChild(panel);

  const title = document.getElementById("part18-title");
  const tabCraft = document.getElementById("part18-tab-craft");
  const tabFurnace = document.getElementById("part18-tab-furnace");
  const stockDiv = document.getElementById("part18-stock");
  const contentDiv = document.getElementById("part18-content");
  const closeBtn = document.getElementById("part18-close");

  let panelMode = "craft";
  let panelOpen = false;

  function renderStock() {
    const important = [
      "plank",
      "cobble",
      "coal_ore",
      "iron_ore",
      "iron_ingot",
      "gold_ore",
      "gold_ingot",
      "torch",
      "crafting_table",
      "furnace",
      "sand",
      "glass"
    ];

    const parts = [];

    important.forEach(function (type) {
      parts.push(humanName(type) + ": " + itemCount(type));
    });

    stockDiv.innerText = parts.join(" | ");
  }

  function renderRecipes() {
    renderStock();

    const recipes = panelMode === "craft" ? craftingRecipes : furnaceRecipes;

    title.innerText =
      panelMode === "craft" ? "مێزی دروستکردن" : "فڕن";

    tabCraft.classList.toggle("active", panelMode === "craft");
    tabFurnace.classList.toggle("active", panelMode === "furnace");

    contentDiv.innerHTML = "";

    recipes.forEach(function (recipe) {
      const row = document.createElement("div");
      row.className = "part18-recipe";

      const info = document.createElement("div");
      info.className = "part18-recipe-info";

      info.innerHTML =
        "<b>" +
        recipe.name +
        "</b><br>پێویست: " +
        costText(recipe.cost) +
        "<br>ئەنجام: " +
        resultText(recipe.result);

      const btn = document.createElement("button");
      btn.className = "part18-btn";
      btn.innerText = "دروستکردن";
      btn.disabled = !canPay(recipe.cost);

      btn.addEventListener("click", function () {
        if (pay(recipe.cost)) {
          give(recipe.result);
          showPart18Message(recipe.name + " دروستکرا");
          renderRecipes();
        } else {
          showPart18Message("کەرەستەی پێویستت نییە");
        }
      });

      row.appendChild(info);
      row.appendChild(btn);
      contentDiv.appendChild(row);
    });
  }

  function isMainMenuOpen() {
    const menu = document.getElementById("part15-menu");

    return menu && menu.style.display !== "none";
  }

  function isDead() {
    const death = document.getElementById("part7-death");

    return death && death.style.display === "flex";
  }

  function openPanel(mode) {
    if (isMainMenuOpen() || isDead()) {
      return;
    }

    panelMode = mode || "craft";
    panelOpen = true;
    panel.style.display = "flex";

    if (document.pointerLockElement === document.body) {
      document.exitPointerLock();
    }

    renderRecipes();
  }

  function closePanel() {
    panelOpen = false;
    panel.style.display = "none";

    if (!isMainMenuOpen() && !isDead()) {
      document.body.requestPointerLock();
    }
  }

  tabCraft.addEventListener("click", function () {
    panelMode = "craft";
    renderRecipes();
  });

  tabFurnace.addEventListener("click", function () {
    panelMode = "furnace";
    renderRecipes();
  });

  closeBtn.addEventListener("click", closePanel);

  panel.addEventListener("click", function (event) {
    if (event.target === panel) {
      closePanel();
    }
  });

  const miniHud = document.createElement("div");
  miniHud.id = "part18-mini-hud";
  document.body.appendChild(miniHud);

  function updateMiniHud() {
    miniHud.innerText =
      "Torch: " +
      itemCount("torch") +
      " | Crafting: " +
      itemCount("crafting_table") +
      " | Furnace: " +
      itemCount("furnace");
  }

  let selectedSpecial = null;
  let previousBlock = null;
  let pendingSpecial = null;
  let specialStarted = 0;

  function selectSpecial(type) {
    selectedSpecial = type;
    previousBlock = currentBlock;

    if (type === "torch") {
      currentBlock = "plank";
    } else if (type === "furnace") {
      currentBlock = "cobble";
    } else if (type === "crafting_table") {
      currentBlock = "plank";
    }

    specialStarted = Date.now();

    if (typeof hud !== "undefined") {
      hud.innerText = "بلۆک: " + humanName(type);
    }

    showPart18Message(humanName(type) + " هەڵبژێردرا");
  }

  function clearSpecial(restore) {
    if (!selectedSpecial) {
      return;
    }

    if (restore && previousBlock) {
      currentBlock = previousBlock;
    }

    selectedSpecial = null;
    previousBlock = null;
    pendingSpecial = null;
  }

  const previousAddBlock = addBlock;

  addBlock = function (x, y, z, type) {
    let finalType = type;

    if (pendingSpecial) {
      finalType = pendingSpecial;
      pendingSpecial = null;
    }

    previousAddBlock(x, y, z, finalType);

    const mesh = blocks.get(blockKey(x, y, z));

    if (mesh && finalType === "torch") {
      mesh.scale.set(0.35, 0.75, 0.35);
      mesh.position.y = y - 0.12;
    }
  };

  window.addEventListener(
    "keydown",
    function (event) {
      if (panelOpen) {
        if (event.code === "Escape" || event.code === "KeyK" || event.code === "KeyF") {
          closePanel();
          event.stopImmediatePropagation();
        }

        return;
      }

      if (isMainMenuOpen() || isDead()) {
        return;
      }

      if (event.code === "KeyK") {
        openPanel("craft");
        event.stopImmediatePropagation();
      }

      if (event.code === "KeyF") {
        openPanel("furnace");
        event.stopImmediatePropagation();
      }

      if (event.code === "KeyY") {
        selectSpecial("crafting_table");
        event.stopImmediatePropagation();
      }

      if (event.code === "KeyU") {
        selectSpecial("furnace");
        event.stopImmediatePropagation();
      }

      if (event.code === "KeyI") {
        selectSpecial("torch");
        event.stopImmediatePropagation();
      }

      if (event.code === "Escape") {
        clearSpecial(true);
      }
    },
    true
  );

  window.addEventListener(
    "mousedown",
    function (event) {
      if (!selectedSpecial) {
        return;
      }

      if (document.pointerLockElement !== document.body) {
        return;
      }

      if (event.button !== 2) {
        return;
      }

      const count = itemCount(selectedSpecial);

      if (count <= 0) {
        showPart18Message(humanName(selectedSpecial) + "ت نییە");
        event.stopImmediatePropagation();
        event.preventDefault();
        return;
      }

      pendingSpecial = selectedSpecial;
      addItem(selectedSpecial, -1);

      setTimeout(function () {
        pendingSpecial = null;
      }, 100);
    },
    true
  );

  const lightGroup = new THREE.Group();
  scene.add(lightGroup);

  const activeLights = new Map();

  function lightKey(x, y, z) {
    return x + "," + y + "," + z;
  }

  function shouldLight(type) {
    return type === "torch" || type === "glowstone" || type === "lava";
  }

  function lightColor(type) {
    if (type === "lava") {
      return 0xff5a00;
    }

    if (type === "glowstone") {
      return 0xffd97a;
    }

    return 0xffb347;
  }

  function lightPower(type) {
    if (type === "lava") {
      return 1.2;
    }

    if (type === "glowstone") {
      return 1.1;
    }

    return 0.9;
  }

  function rebuildNearbyLights() {
    const maxLights = 18;
    const candidates = [];

    blocks.forEach(function (mesh) {
      if (!mesh || !mesh.userData) {
        return;
      }

      const type = mesh.userData.type;

      if (!shouldLight(type)) {
        return;
      }

      const dx = mesh.userData.x - player.x;
      const dy = mesh.userData.y - player.y;
      const dz = mesh.userData.z - player.z;
      const distSq = dx * dx + dy * dy + dz * dz;

      if (distSq < 900) {
        candidates.push({
          x: mesh.userData.x,
          y: mesh.userData.y,
          z: mesh.userData.z,
          type: type,
          distSq: distSq
        });
      }
    });

    candidates.sort(function (a, b) {
      return a.distSq - b.distSq;
    });

    const needed = new Set();

    for (let i = 0; i < candidates.length && i < maxLights; i++) {
      const c = candidates[i];
      const key = lightKey(c.x, c.y, c.z);
      needed.add(key);

      if (!activeLights.has(key)) {
        const point = new THREE.PointLight(
          lightColor(c.type),
          lightPower(c.type),
          c.type === "torch" ? 9 : 12,
          2
        );

        point.position.set(c.x, c.y + 0.25, c.z);
        lightGroup.add(point);
        activeLights.set(key, point);
      }
    }

    activeLights.forEach(function (light, key) {
      if (!needed.has(key)) {
        lightGroup.remove(light);
        activeLights.delete(key);
      }
    });
  }

  const oldRemoveBlock = removeBlock;

  removeBlock = function (x, y, z) {
    const key = blockKey(x, y, z);
    const mesh = blocks.get(key);

    if (mesh && mesh.userData) {
      const type = mesh.userData.type;

      if (
        type === "crafting_table" ||
        type === "furnace" ||
        type === "torch" ||
        type === "coal_ore" ||
        type === "iron_ore" ||
        type === "gold_ore" ||
        type === "sand" ||
        type === "glass" ||
        type === "cobble" ||
        type === "plank"
      ) {
        addItem(type, 1);
      }
    }

    oldRemoveBlock(x, y, z);
  };

  const part18Clock = new THREE.Clock();
  let lightTimer = 0;

  function part18Loop() {
    requestAnimationFrame(part18Loop);

    const delta = Math.min(part18Clock.getDelta(), 0.05);

    if (selectedSpecial) {
      if (Date.now() - specialStarted > 4000) {
        clearSpecial(true);
      }
    }

    lightTimer -= delta;

    if (lightTimer <= 0) {
      rebuildNearbyLights();
      lightTimer = 0.7;
    }

    miniHud.style.display =
      isMainMenuOpen() || isDead() ? "none" : "block";
  }

  updateMiniHud();
  part18Loop();

  showPart18Message(
    "Part 18: Crafting، Furnace، Torch و ڕووناکی زیادکران — K/F/Y/U/I"
  );
})();
</script>
