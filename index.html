<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مینی کرافت - بەشی ١</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      z-index: 10;
      cursor: pointer;
      user-select: none;
      direction: rtl;
      text-align: center;
    }

    #overlay h1 {
      margin-bottom: 10px;
    }

    #overlay p {
      margin: 4px 0;
    }

    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 28px;
      z-index: 5;
      pointer-events: none;
      text-shadow: 0 0 4px black;
    }

    #hud {
      position: fixed;
      right: 10px;
      top: 10px;
      color: white;
      z-index: 5;
      pointer-events: none;
      text-shadow: 0 0 4px black;
      direction: rtl;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <h1>مینی کرافت</h1>
    <p>کلیک بکە بۆ دەستپێکردن</p>
    <p>W / A / S / D = جوڵە</p>
    <p>Space = بازدان</p>
    <p>ماوس = ڕوانین</p>
    <p>کلیکی چەپ = بلۆک بشکێنە</p>
    <p>کلیکی ڕاست = بلۆک دابنێ</p>
    <p>1 / 2 / 3 = هەڵبژاردنی بلۆک</p>
  </div>

  <div id="crosshair">+</div>
  <div id="hud">بلۆک: grass</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    const overlay = document.getElementById("overlay");
    const crosshair = document.getElementById("crosshair");
    const hud = document.getElementById("hud");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.rotation.order = "YXZ";

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 0.85);
    sunLight.position.set(30, 60, 20);
    scene.add(sunLight);

    const WORLD_SIZE = 24;
    const WORLD_HALF = Math.floor(WORLD_SIZE / 2);

    const blocks = new Map();
    const blockGeometry = new THREE.BoxGeometry(1, 1, 1);

    const materials = {
      grass: new THREE.MeshLambertMaterial({ color: 0x58b54b }),
      dirt: new THREE.MeshLambertMaterial({ color: 0x8a5a2b }),
      stone: new THREE.MeshLambertMaterial({ color: 0x8f8f8f }),
      bedrock: new THREE.MeshLambertMaterial({ color: 0x222222 })
    };

    let yaw = 0;
    let pitch = 0;

    const keys = {};

    const player = {
      x: 0,
      y: 6,
      z: 0
    };

    const velocity = {
      x: 0,
      y: 0,
      z: 0
    };

    let onGround = false;
    let currentBlock = "grass";

    function blockKey(x, y, z) {
      return x + "," + y + "," + z;
    }

    function addBlock(x, y, z, type) {
      const key = blockKey(x, y, z);

      if (blocks.has(key)) {
        return;
      }

      const material = materials[type] || materials.stone;
      const mesh = new THREE.Mesh(blockGeometry, material);

      mesh.position.set(x, y, z);
      mesh.userData = {
        x: x,
        y: y,
        z: z,
        type: type
      };

      scene.add(mesh);
      blocks.set(key, mesh);
    }

    function removeBlock(x, y, z) {
      const key = blockKey(x, y, z);
      const mesh = blocks.get(key);

      if (!mesh) {
        return;
      }

      if (mesh.userData.type === "bedrock") {
        return;
      }

      scene.remove(mesh);
      blocks.delete(key);
    }

    function generateWorld() {
      for (let x = -WORLD_HALF; x <= WORLD_HALF; x++) {
        for (let z = -WORLD_HALF; z <= WORLD_HALF; z++) {
          const height = Math.max(
            0,
            Math.floor(Math.sin(x * 0.18) * Math.cos(z * 0.18) * 2)
          );

          for (let y = -3; y <= height; y++) {
            let type = "stone";

            if (y === -3) {
              type = "bedrock";
            } else if (y === height) {
              type = "grass";
            } else if (y >= height - 2) {
              type = "dirt";
            }

            addBlock(x, y, z, type);
          }
        }
      }
    }

    function setBlock(type) {
      currentBlock = type;
      hud.innerText = "بلۆک: " + type;
    }

    function getCollidingBlock(px, py, pz) {
      const half = 0.3;
      const height = 1.8;

      const minX = px - half;
      const maxX = px + half;
      const minY = py;
      const maxY = py + height;
      const minZ = pz - half;
      const maxZ = pz + half;

      const startX = Math.floor(minX - 0.5);
      const endX = Math.ceil(maxX + 0.5);

      const startY = Math.floor(minY - 0.5);
      const endY = Math.ceil(maxY + 0.5);

      const startZ = Math.floor(minZ - 0.5);
      const endZ = Math.ceil(maxZ + 0.5);

      for (let x = startX; x <= endX; x++) {
        for (let y = startY; y <= endY; y++) {
          for (let z = startZ; z <= endZ; z++) {
            const key = blockKey(x, y, z);

            if (!blocks.has(key)) {
              continue;
            }

            const blockMinX = x - 0.5;
            const blockMaxX = x + 0.5;

            const blockMinY = y - 0.5;
            const blockMaxY = y + 0.5;

            const blockMinZ = z - 0.5;
            const blockMaxZ = z + 0.5;

            if (
              blockMaxX > minX &&
              blockMinX < maxX &&
              blockMaxY > minY &&
              blockMinY < maxY &&
              blockMaxZ > minZ &&
              blockMinZ < maxZ
            ) {
              return { x: x, y: y, z: z };
            }
          }
        }
      }

      return null;
    }

    function collides(px, py, pz) {
      return getCollidingBlock(px, py, pz) !== null;
    }

    function blockIntersectsPlayer(bx, by, bz) {
      const half = 0.3;
      const height = 1.8;

      const minX = player.x - half;
      const maxX = player.x + half;
      const minY = player.y;
      const maxY = player.y + height;
      const minZ = player.z - half;
      const maxZ = player.z + half;

      const blockMinX = bx - 0.5;
      const blockMaxX = bx + 0.5;

      const blockMinY = by - 0.5;
      const blockMaxY = by + 0.5;

      const blockMinZ = bz - 0.5;
      const blockMaxZ = bz + 0.5;

      return (
        blockMaxX > minX &&
        blockMinX < maxX &&
        blockMaxY > minY &&
        blockMinY < maxY &&
        blockMaxZ > minZ &&
        blockMinZ < maxZ
      );
    }

    const raycaster = new THREE.Raycaster();
    const screenCenter = new THREE.Vector2(0, 0);

    function raycastBlocks() {
      raycaster.setFromCamera(screenCenter, camera);
      raycaster.far = 6;

      return raycaster.intersectObjects(Array.from(blocks.values()));
    }

    function updatePlayer(delta) {
      const speed = 5;

      const forward = new THREE.Vector3(0, 0, -1);
      forward.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

      const right = new THREE.Vector3(1, 0, 0);
      right.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

      const move = new THREE.Vector3();

      if (keys["KeyW"]) {
        move.add(forward);
      }

      if (keys["KeyS"]) {
        move.sub(forward);
      }

      if (keys["KeyD"]) {
        move.add(right);
      }

      if (keys["KeyA"]) {
        move.sub(right);
      }

      if (move.lengthSq() > 0) {
        move.normalize();
        move.multiplyScalar(speed);
      }

      velocity.x = move.x;
      velocity.z = move.z;

      velocity.y -= 25 * delta;

      if (keys["Space"] && onGround) {
        velocity.y = 8;
      }

      const newX = player.x + velocity.x * delta;

      if (!collides(newX, player.y, player.z)) {
        player.x = newX;
      } else {
        velocity.x = 0;
      }

      const newZ = player.z + velocity.z * delta;

      if (!collides(player.x, player.y, newZ)) {
        player.z = newZ;
      } else {
        velocity.z = 0;
      }

      const newY = player.y + velocity.y * delta;
      const hit = getCollidingBlock(player.x, newY, player.z);

      if (!hit) {
        player.y = newY;
        onGround = false;
      } else {
        if (velocity.y < 0) {
          onGround = true;
          player.y = hit.y + 0.5 + 0.001;

          while (collides(player.x, player.y, player.z)) {
            player.y += 0.01;
          }
        }

        velocity.y = 0;
      }

      camera.position.set(player.x, player.y + 1.6, player.z);
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;
      camera.rotation.z = 0;
    }

    overlay.addEventListener("click", function () {
      document.body.requestPointerLock();
    });

    document.addEventListener("pointerlockchange", function () {
      if (document.pointerLockElement === document.body) {
        overlay.style.display = "none";
        crosshair.style.display = "block";
      } else {
        overlay.style.display = "flex";
        crosshair.style.display = "none";
      }
    });

    document.addEventListener("mousemove", function (event) {
      if (document.pointerLockElement !== document.body) {
        return;
      }

      yaw -= event.movementX * 0.002;
      pitch -= event.movementY * 0.002;

      const maxPitch = Math.PI / 2 - 0.01;

      if (pitch > maxPitch) {
        pitch = maxPitch;
      }

      if (pitch < -maxPitch) {
        pitch = -maxPitch;
      }
    });

    window.addEventListener("keydown", function (event) {
      keys[event.code] = true;

      if (event.code === "Space") {
        event.preventDefault();
      }

      if (event.code === "Digit1") {
        setBlock("grass");
      }

      if (event.code === "Digit2") {
        setBlock("dirt");
      }

      if (event.code === "Digit3") {
        setBlock("stone");
      }
    });

    window.addEventListener("keyup", function (event) {
      keys[event.code] = false;
    });

    window.addEventListener("mousedown", function (event) {
      if (document.pointerLockElement !== document.body) {
        return;
      }

      event.preventDefault();

      const intersects = raycastBlocks();

      if (intersects.length === 0) {
        return;
      }

      const hit = intersects[0];
      const block = hit.object.userData;

      if (event.button === 0) {
        removeBlock(block.x, block.y, block.z);
      }

      if (event.button === 2) {
        const normal = hit.face.normal;

        const x = block.x + Math.round(normal.x);
        const y = block.y + Math.round(normal.y);
        const z = block.z + Math.round(normal.z);

        const key = blockKey(x, y, z);

        if (!blocks.has(key) && !blockIntersectsPlayer(x, y, z)) {
          addBlock(x, y, z, currentBlock);
        }
      }
    });

    window.addEventListener("contextmenu", function (event) {
      event.preventDefault();
    });

    window.addEventListener("resize", function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.05);

      updatePlayer(delta);
      renderer.render(scene, camera);
    }

    generateWorld();
    setBlock("grass");
    animate();
  </script>

</body>
</html>
<script>
(function () {
  if (typeof scene === "undefined") {
    console.error("Part 2: سەرەتا دەبێت Part 1 هەبێت.");
    return;
  }

  if (window.__minicraftPart2Loaded) {
    return;
  }

  window.__minicraftPart2Loaded = true;

  const style = document.createElement("style");
  style.textContent = `
    #hotbar {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      z-index: 20;
      pointer-events: none;
      direction: ltr;
    }

    .hotbar-slot {
      width: 46px;
      height: 46px;
      border: 3px solid rgba(255, 255, 255, 0.35);
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .hotbar-slot.selected {
      border-color: white;
      background: rgba(255, 255, 255, 0.18);
    }

    .block-preview {
      width: 28px;
      height: 28px;
      border-radius: 3px;
      box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.25);
    }
  `;

  document.head.appendChild(style);

  materials.wood = new THREE.MeshLambertMaterial({ color: 0x7a4f21 });
  materials.leaves = new THREE.MeshLambertMaterial({
    color: 0x2f8f2f,
    transparent: true,
    opacity: 0.95
  });
  materials.sand = new THREE.MeshLambertMaterial({ color: 0xd8c37a });
  materials.plank = new THREE.MeshLambertMaterial({ color: 0xb58a4d });
  materials.cobble = new THREE.MeshLambertMaterial({ color: 0x6f6f6f });
  materials.glass = new THREE.MeshLambertMaterial({
    color: 0xaee7ff,
    transparent: true,
    opacity: 0.35
  });

  const hotbarItems = [
    "grass",
    "dirt",
    "stone",
    "wood",
    "plank",
    "leaves",
    "sand",
    "cobble",
    "glass"
  ];

  let selectedSlot = 0;

  const hotbar = document.createElement("div");
  hotbar.id = "hotbar";
  document.body.appendChild(hotbar);

  function renderHotbar() {
    hotbar.innerHTML = "";

    hotbarItems.forEach(function (item, index) {
      const slot = document.createElement("div");
      slot.className = "hotbar-slot";

      if (index === selectedSlot) {
        slot.classList.add("selected");
      }

      const preview = document.createElement("div");
      preview.className = "block-preview";

      if (item === "glass") {
        preview.style.background = "rgba(174, 231, 255, 0.35)";
        preview.style.border = "2px solid rgba(255, 255, 255, 0.5)";
      } else {
        preview.style.background = "#" + materials[item].color.getHexString();
      }

      slot.appendChild(preview);
      hotbar.appendChild(slot);
    });
  }

  function selectSlot(index) {
    selectedSlot = index;
    setBlock(hotbarItems[index]);
    renderHotbar();
  }

  window.addEventListener("keydown", function (event) {
    const digitCodes = [
      "Digit1",
      "Digit2",
      "Digit3",
      "Digit4",
      "Digit5",
      "Digit6",
      "Digit7",
      "Digit8",
      "Digit9"
    ];

    const index = digitCodes.indexOf(event.code);

    if (index !== -1) {
      selectSlot(index);
    }
  });

  window.addEventListener(
    "wheel",
    function (event) {
      if (document.pointerLockElement !== document.body) {
        return;
      }

      if (event.deltaY > 0) {
        selectSlot((selectedSlot + 1) % hotbarItems.length);
      } else {
        selectSlot(
          (selectedSlot + hotbarItems.length - 1) % hotbarItems.length
        );
      }
    },
    { passive: true }
  );

  const outlineGeometry = new THREE.BoxGeometry(1.01, 1.01, 1.01);
  const outlineMaterial = new THREE.MeshBasicMaterial({
    color: 0xffffff,
    wireframe: true,
    transparent: true,
    opacity: 0.6
  });

  const outline = new THREE.Mesh(outlineGeometry, outlineMaterial);
  outline.visible = false;
  scene.add(outline);

  function updateOutline() {
    if (document.pointerLockElement !== document.body) {
      outline.visible = false;
      return;
    }

    const intersects = raycastBlocks();

    if (intersects.length > 0) {
      const block = intersects[0].object.userData;
      outline.position.set(block.x, block.y, block.z);
      outline.visible = true;
    } else {
      outline.visible = false;
    }
  }

  function getGroundHeight(x, z) {
    for (let y = 15; y >= -3; y--) {
      const mesh = blocks.get(blockKey(x, y, z));

      if (mesh && mesh.userData.type !== "leaves") {
        return y;
      }
    }

    return null;
  }

  function addTree(x, z) {
    const groundY = getGroundHeight(x, z);

    if (groundY === null) {
      return;
    }

    const trunkHeight = 4;
    const topY = groundY + trunkHeight;

    for (let y = 1; y <= trunkHeight; y++) {
      addBlock(x, groundY + y, z, "wood");
    }

    for (let dy = 0; dy <= 2; dy++) {
      const radius = dy === 2 ? 1 : 2;

      for (let dx = -radius; dx <= radius; dx++) {
        for (let dz = -radius; dz <= radius; dz++) {
          if (dy < 2 && dx === 0 && dz === 0) {
            continue;
          }

          if (dy === 2 && Math.abs(dx) + Math.abs(dz) > 1) {
            continue;
          }

          addBlock(x + dx, topY + dy, z + dz, "leaves");
        }
      }
    }
  }

  const treePositions = [
    [-7, -5],
    [5, 6],
    [-8, 8],
    [8, -8],
    [1, -9],
    [-2, 9],
    [9, 2],
    [-10, -2]
  ];

  treePositions.forEach(function (position) {
    addTree(position[0], position[1]);
  });

  function part2Loop() {
    requestAnimationFrame(part2Loop);
    updateOutline();
  }

  selectSlot(0);
  part2Loop();
})();
</script>
<script>
(function () {
  if (typeof scene === "undefined" || typeof blocks === "undefined") {
    console.error("Part 3: سەرەتا دەبێت Part 1 هەبێت.");
    return;
  }

  if (window.__minicraftPart3Loaded) {
    return;
  }

  window.__minicraftPart3Loaded = true;

  const style = document.createElement("style");
  style.textContent = `
    #mc-message {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.65);
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      z-index: 30;
      opacity: 0;
      transition: opacity 0.25s;
      direction: rtl;
      font-size: 14px;
      pointer-events: none;
      text-align: center;
    }
  `;

  document.head.appendChild(style);

  const message = document.createElement("div");
  message.id = "mc-message";
  document.body.appendChild(message);

  let messageTimer = null;

  function showMessage(text) {
    message.innerText = text;
    message.style.opacity = "1";

    clearTimeout(messageTimer);

    messageTimer = setTimeout(function () {
      message.style.opacity = "0";
    }, 2200);
  }

  scene.fog = new THREE.Fog(0x87ceeb, 35, 95);

  const cloudGroup = new THREE.Group();
  scene.add(cloudGroup);

  const cloudMaterial = new THREE.MeshBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.75
  });

  const cloudBaseGeometry = new THREE.BoxGeometry(1, 1, 1);

  function createCloud() {
    const cloud = new THREE.Group();

    const pieces = 3 + Math.floor(Math.random() * 3);

    for (let i = 0; i < pieces; i++) {
      const piece = new THREE.Mesh(cloudBaseGeometry, cloudMaterial);

      piece.scale.set(
        4 + Math.random() * 6,
        1,
        3 + Math.random() * 4
      );

      piece.position.set(
        (Math.random() - 0.5) * 8,
        0,
        (Math.random() - 0.5) * 5
      );

      cloud.add(piece);
    }

    cloud.position.set(
      (Math.random() - 0.5) * 120,
      24 + Math.random() * 8,
      (Math.random() - 0.5) * 120
    );

    cloud.userData.speed = 0.5 + Math.random() * 1.2;

    return cloud;
  }

  for (let i = 0; i < 14; i++) {
    cloudGroup.add(createCloud());
  }

  function updateClouds(delta) {
    cloudGroup.children.forEach(function (cloud) {
      cloud.position.x += cloud.userData.speed * delta;

      if (cloud.position.x > 80) {
        cloud.position.x = -80;
      }
    });
  }

  const SAVE_KEY = "minicraft_save_v1";

  function clearAllBlocks() {
    blocks.forEach(function (mesh) {
      scene.remove(mesh);
    });

    blocks.clear();
  }

  function saveWorld(silent) {
    try {
      const data = {
        version: 1,
        player: {
          x: player.x,
          y: player.y,
          z: player.z
        },
        yaw: yaw,
        pitch: pitch,
        blocks: []
      };

      blocks.forEach(function (mesh) {
        data.blocks.push({
          x: mesh.userData.x,
          y: mesh.userData.y,
          z: mesh.userData.z,
          type: mesh.userData.type
        });
      });

      localStorage.setItem(SAVE_KEY, JSON.stringify(data));

      if (!silent) {
        showMessage("جیهان پاشەکەوت کرا");
      }
    } catch (error) {
      if (!silent) {
        showMessage("هەڵە لە پاشەکەوتکردن");
      }
    }
  }

  function loadWorld() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);

      if (!raw) {
        showMessage("هیچ پاشەکەوتێک نەدۆزرایەوە");
        return;
      }

      const data = JSON.parse(raw);

      clearAllBlocks();

      data.blocks.forEach(function (b) {
        addBlock(b.x, b.y, b.z, b.type);
      });

      if (data.player) {
        player.x = data.player.x;
        player.y = data.player.y;
        player.z = data.player.z;
      }

      if (typeof data.yaw === "number") {
        yaw = data.yaw;
      }

      if (typeof data.pitch === "number") {
        pitch = data.pitch;
      }

      velocity.x = 0;
      velocity.y = 0;
      velocity.z = 0;

      showMessage("جیهان بارکرا");
    } catch (error) {
      showMessage("هەڵە لە بارکردن");
    }
  }

  function getTopBlock(x, z) {
    for (let y = 25; y >= -3; y--) {
      const mesh = blocks.get(blockKey(x, y, z));

      if (mesh && mesh.userData.type !== "leaves") {
        return y;
      }
    }

    return null;
  }

  function addTree(x, z) {
    const groundY = getTopBlock(x, z);

    if (groundY === null) {
      return;
    }

    const trunkHeight = 4;
    const topY = groundY + trunkHeight;

    for (let y = 1; y <= trunkHeight; y++) {
      addBlock(x, groundY + y, z, "wood");
    }

    for (let dy = 0; dy <= 2; dy++) {
      const radius = dy === 2 ? 1 : 2;

      for (let dx = -radius; dx <= radius; dx++) {
        for (let dz = -radius; dz <= radius; dz++) {
          if (dy < 2 && dx === 0 && dz === 0) {
            continue;
          }

          if (dy === 2 && Math.abs(dx) + Math.abs(dz) > 1) {
            continue;
          }

          addBlock(x + dx, topY + dy, z + dz, "leaves");
        }
      }
    }
  }

  function addDefaultTrees() {
    const treePositions = [
      [-7, -5],
      [5, 6],
      [-8, 8],
      [8, -8],
      [1, -9],
      [-2, 9],
      [9, 2],
      [-10, -2]
    ];

    treePositions.forEach(function (position) {
      addTree(position[0], position[1]);
    });
  }

  function resetWorld() {
    clearAllBlocks();
    generateWorld();
    addDefaultTrees();

    player.x = 0;
    player.y = 6;
    player.z = 0;

    velocity.x = 0;
    velocity.y = 0;
    velocity.z = 0;

    yaw = 0;
    pitch = 0;

    showMessage("جیهان نوێ کرایەوە");
  }

  window.addEventListener("keydown", function (event) {
    if (event.code === "KeyP") {
      saveWorld(false);
    }

    if (event.code === "KeyO") {
      loadWorld();
    }

    if (event.code === "KeyR" && event.shiftKey) {
      resetWorld();
    }
  });

  setInterval(function () {
    saveWorld(true);
  }, 30000);

  window.addEventListener("beforeunload", function () {
    saveWorld(true);
  });

  const part3Clock = new THREE.Clock();

  function part3Loop() {
    requestAnimationFrame(part3Loop);

    const delta = Math.min(part3Clock.getDelta(), 0.05);

    updateClouds(delta);
  }

  part3Loop();

  showMessage("P = پاشەکەوت | O = بارکردن | Shift+R = نوێکردنەوە");
})();

  `;

  document.head.appendChild(style);

  let part4MessageTimer = null;

  function showPart4Message(text) {
    let message = document.getElementById("mc-message");

    if (!message) {
      message = document.createElement("div");
      message.id = "mc-message";
      document.body.appendChild(message);
    }

    message.innerText = text;
    message.style.opacity = "1";

    clearTimeout(part4MessageTimer);

    part4MessageTimer = setTimeout(function () {
      message.style.opacity = "0";
    }, 2200);
  }

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  let time = 0.3;
  let fastTime = false;

  const NORMAL_CYCLE = 180;
  const FAST_CYCLE = 15;

  const dayColor = new THREE.Color(0x87ceeb);
  const nightColor = new THREE.Color(0x0b1026);
  const sunsetColor = new THREE.Color(0xff9e5e);
  const skyColor = new THREE.Color();

  const cloudMaterials = [];

  scene.traverse(function (object) {
    if (
      object.isMesh &&
      object.material &&
      object.material.isMeshBasicMaterial &&
      object.material.transparent &&
      Math.abs(object.material.opacity - 0.75) < 0.01
    ) {
      if (cloudMaterials.indexOf(object.material) === -1) {
        cloudMaterials.push(object.material);
      }
    }
  });

  const sunGeometry = new THREE.SphereGeometry(4, 16, 16);
  const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffdd55 });
  sunMaterial.fog = false;

  const sunMesh = new THREE.Mesh(sunGeometry, sunMaterial);
  scene.add(sunMesh);

  const moonGeometry = new THREE.SphereGeometry(3, 16, 16);
  const moonMaterial = new THREE.MeshBasicMaterial({ color: 0xdfe6f0 });
  moonMaterial.fog = false;

  const moonMesh = new THREE.Mesh(moonGeometry, moonMaterial);
  scene.add(moonMesh);

  const starCount = 500;
  const starPositions = new Float32Array(starCount * 3);

  for (let i = 0; i < starCount; i++) {
    const radius = 130;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(Math.random() * 2 - 1);

    let x = radius * Math.sin(phi) * Math.cos(theta);
    let y = radius * Math.cos(phi);
    let z = radius * Math.sin(phi) * Math.sin(theta);

    if (y < 5) {
      y = 5 + Math.random() * 40;
    }

    starPositions[i * 3] = x;
    starPositions[i * 3 + 1] = y;
    starPositions[i * 3 + 2] = z;
  }

  const starGeometry = new THREE.BufferGeometry();
  starGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(starPositions, 3)
  );

  const starMaterial = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.9,
    transparent: true,
    opacity: 0
  });

  starMaterial.fog = false;

  const stars = new THREE.Points(starGeometry, starMaterial);
  scene.add(stars);

  function updateDayNight(delta) {
    const cycle = fastTime ? FAST_CYCLE : NORMAL_CYCLE;

    time += delta / cycle;

    if (time >= 1) {
      time -= 1;
    }

    const angle = time * Math.PI * 2;
    const sunHeight = Math.sin(angle);

    const sunX = Math.cos(angle) * 80;
    const sunY = sunHeight * 80;
    const sunZ = 25;

    sunMesh.position.set(sunX, sunY, sunZ);
    moonMesh.position.set(-sunX, -sunY, -sunZ);

    sunMesh.visible = sunY > -15;
    moonMesh.visible = sunY < 15;

    const daylight = clamp((sunHeight + 0.25) / 0.6, 0, 1);

    if (typeof sunLight !== "undefined") {
      sunLight.position.set(sunX, Math.max(sunY, 5), sunZ);
      sunLight.intensity = 0.05 + daylight * 0.85;
    }

    if (typeof ambientLight !== "undefined") {
      ambientLight.intensity = 0.18 + daylight * 0.55;
    }

    skyColor.copy(nightColor).lerp(dayColor, daylight);

    const sunsetAmount = Math.max(
      0,
      1 - Math.abs(sunHeight) / 0.25
    );

    if (sunsetAmount > 0 && sunHeight > -0.35) {
      skyColor.lerp(sunsetColor, sunsetAmount * 0.35);
    }

    scene.background = skyColor;

    if (scene.fog) {
      scene.fog.color.copy(skyColor);
    }

    starMaterial.opacity = clamp(1 - daylight * 1.4, 0, 1);
    stars.rotation.y += delta * 0.01;

    cloudMaterials.forEach(function (material) {
      material.color.setScalar(0.3 + daylight * 0.7);
    });
  }

  window.addEventListener("keydown", function (event) {
    if (event.code === "KeyT") {
      fastTime = !fastTime;

      if (fastTime) {
        showPart4Message("کات خێرا کرا");
      } else {
        showPart4Message("کات ئاسایی کرا");
      }
    }
  });

  const part4Clock = new THREE.Clock();

  function part4Loop() {
    requestAnimationFrame(part4Loop);

    const delta = Math.min(part4Clock.getDelta(), 0.05);

    updateDayNight(delta);
  }

  part4Loop();

  showPart4Message("Part 4: شەو و ڕۆژ زیادکرا — T = کات خێرا/ئاسایی");
})();

    return;
  }

  if (window.__minicraftPart5Loaded) {

  window.__minicraftPart5Loaded = true;

  const style = document.createElement("style");

  document.head.appendChild(style);

  let part5MessageTimer = null;

  function showPart5Message(text) {

    if (!message) {
      message = document.createElement("div");
      message.id = "mc-message";
      document.body.appendChild(message);
    }

    message.innerText = text;
    message.style.opacity = "1";

    clearTimeout(part5MessageTimer);

    part5MessageTimer = setTimeout(function () {
      message.style.opacity = "0";
    }, 2200);
  }

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  if (!materials.water) {
    materials.water = new THREE.MeshLambertMaterial({
      color: 0x3b7fd4,
      transparent: true,
      opacity: 0.65
    });
  }

  if (!materials.sand) {
    materials.sand = new THREE.MeshLambertMaterial({
      color: 0xd8c37a
    });
  }

  if (!materials.cobble) {
    materials.cobble = new THREE.MeshLambertMaterial({
      color: 0x6f6f6f
    });
  }

  if (!materials.wood) {
    materials.wood = new THREE.MeshLambertMaterial({
      color: 0x7a4f21
    });
  }

  if (!materials.leaves) {
    materials.leaves = new THREE.MeshLambertMaterial({
      color: 0x2f8f2f,
      transparent: true,
      opacity: 0.95
    });
  }

  if (!materials.plank) {
    materials.plank = new THREE.MeshLambertMaterial({
      color: 0xb58a4d
    });
  }

  const waterOverlay = document.createElement("div");
  waterOverlay.id = "water-overlay";
  document.body.appendChild(waterOverlay);

  const part5Items = [
    "grass",
    "dirt",
    "stone",
    "wood",
    "plank",
    "leaves",
    "sand",
    "cobble",
    "water"
  ];

  let part5Selected = 0;

  const part5Hotbar = document.createElement("div");
  part5Hotbar.id = "part5-hotbar";
  document.body.appendChild(part5Hotbar);

  function renderPart5Hotbar() {
    part5Hotbar.innerHTML = "";

    part5Items.forEach(function (item, index) {
      const slot = document.createElement("div");
      slot.className = "part5-slot";

      if (index === part5Selected) {
        slot.classList.add("selected");
      }

      const preview = document.createElement("div");
      preview.className = "part5-preview";

      if (item === "water") {
        preview.style.background = "rgba(59, 127, 212, 0.65)";
        preview.style.border = "2px solid rgba(255, 255, 255, 0.45)";
      } else {
        let color = "#888888";

        if (materials[item] && materials[item].color) {
          color = "#" + materials[item].color.getHexString();
        }

        preview.style.background = color;
      }

      slot.appendChild(preview);
      part5Hotbar.appendChild(slot);
    });
  }

  function selectPart5Slot(index) {
    part5Selected = index;
    currentBlock = part5Items[index];

    if (typeof hud !== "undefined") {
      hud.innerText = "بلۆک: " + currentBlock;
    }

    renderPart5Hotbar();
  }

  window.addEventListener(
    "keydown",
    function (event) {
      const digitCodes = [
        "Digit1",
        "Digit2",
        "Digit3",
        "Digit4",
        "Digit5",
        "Digit6",
        "Digit7",
        "Digit8",
        "Digit9"
      ];

      const index = digitCodes.indexOf(event.code);

      if (index !== -1) {
        selectPart5Slot(index);
        event.stopImmediatePropagation();
      }

      if (event.code === "KeyR" && event.shiftKey) {
        part5ResetWorld();
        event.stopImmediatePropagation();
      }
    },
    true
  );

  window.addEventListener(
    "wheel",
    function (event) {
      if (document.pointerLockElement !== document.body) {
        return;
      }

      if (event.deltaY > 0) {
        selectPart5Slot((part5Selected + 1) % part5Items.length);
      } else {
        selectPart5Slot(
          (part5Selected + part5Items.length - 1) % part5Items.length
        );
      }

      event.stopImmediatePropagation();
    },
    {
      capture: true,
      passive: true
    }
  );

  getCollidingBlock = function (px, py, pz) {
    const half = 0.3;
    const height = 1.8;

    const minX = px - half;
    const maxX = px + half;
    const minY = py;
    const maxY = py + height;
    const minZ = pz - half;
    const maxZ = pz + half;

    const startX = Math.floor(minX - 0.5);
    const endX = Math.ceil(maxX + 0.5);

    const startY = Math.floor(minY - 0.5);
    const endY = Math.ceil(maxY + 0.5);

    const startZ = Math.floor(minZ - 0.5);
    const endZ = Math.ceil(maxZ + 0.5);

    for (let x = startX; x <= endX; x++) {
      for (let y = startY; y <= endY; y++) {
        for (let z = startZ; z <= endZ; z++) {
          const mesh = blocks.get(blockKey(x, y, z));

          if (!mesh) {
            continue;
          }

          if (mesh.userData.type === "water") {
            continue;
          }

          const blockMinX = x - 0.5;
          const blockMaxX = x + 0.5;

          const blockMinY = y - 0.5;
          const blockMaxY = y + 0.5;

          const blockMinZ = z - 0.5;
          const blockMaxZ = z + 0.5;

          if (
            blockMaxX > minX &&
            blockMinX < maxX &&
            blockMaxY > minY &&
            blockMinY < maxY &&
            blockMaxZ > minZ &&
            blockMinZ < maxZ
          ) {
            return {
              x: x,
              y: y,
              z: z
            };
          }
        }
      }
    }

    return null;
  };

  collides = function (px, py, pz) {
    return getCollidingBlock(px, py, pz) !== null;
  };

  function isPlayerInWater() {
    const half = 0.3;
    const height = 1.8;

    const minX = player.x - half;
    const maxX = player.x + half;
    const minY = player.y;
    const maxY = player.y + height;
    const minZ = player.z - half;
    const maxZ = player.z + half;

    const startX = Math.floor(minX - 0.5);
    const endX = Math.ceil(maxX + 0.5);

    const startY = Math.floor(minY - 0.5);
    const endY = Math.ceil(maxY + 0.5);

    const startZ = Math.floor(minZ - 0.5);
    const endZ = Math.ceil(maxZ + 0.5);

    for (let x = startX; x <= endX; x++) {
      for (let y = startY; y <= endY; y++) {
        for (let z = startZ; z <= endZ; z++) {
          const mesh = blocks.get(blockKey(x, y, z));

          if (!mesh) {
            continue;
          }

          if (mesh.userData.type !== "water") {
            continue;
          }

          const blockMinX = x - 0.5;
          const blockMaxX = x + 0.5;

          const blockMinY = y - 0.5;
          const blockMaxY = y + 0.5;

          const blockMinZ = z - 0.5;
          const blockMaxZ = z + 0.5;

          if (
            blockMaxX > minX &&
            blockMinX < maxX &&
            blockMaxY > minY &&
            blockMinY < maxY &&
            blockMaxZ > minZ &&
            blockMinZ < maxZ
          ) {
            return true;
          }
        }
      }
    }

    return false;
  }

  function isEyeInWater() {
    const x = Math.floor(camera.position.x + 0.5);
    const y = Math.floor(camera.position.y + 0.5);
    const z = Math.floor(camera.position.z + 0.5);

    const mesh = blocks.get(blockKey(x, y, z));

    return mesh && mesh.userData.type === "water";
  }

  updatePlayer = function (delta) {
    const inWater = isPlayerInWater();
    const speed = inWater ? 3 : 5;

    const forward = new THREE.Vector3(0, 0, -1);
    forward.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

    const right = new THREE.Vector3(1, 0, 0);
    right.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

    const move = new THREE.Vector3();

    if (keys["KeyW"]) {
      move.add(forward);
    }

    if (keys["KeyS"]) {
      move.sub(forward);
    }

    if (keys["KeyD"]) {
      move.add(right);
    }

    if (keys["KeyA"]) {
      move.sub(right);
    }

    if (move.lengthSq() > 0) {
      move.normalize();
      move.multiplyScalar(speed);
    }

    velocity.x = move.x;
    velocity.z = move.z;

    if (inWater) {
      velocity.y -= 7 * delta;

      if (keys["Space"]) {
        velocity.y += 14 * delta;
      }

      velocity.y = clamp(velocity.y, -3.5, 3.5);
    } else {
      velocity.y -= 25 * delta;

      if (keys["Space"] && onGround) {
        velocity.y = 8;
      }
    }

    const newX = player.x + velocity.x * delta;

    if (!collides(newX, player.y, player.z)) {
      player.x = newX;
    } else {
      velocity.x = 0;
    }

    const newZ = player.z + velocity.z * delta;

    if (!collides(player.x, player.y, newZ)) {
      player.z = newZ;
    } else {
      velocity.z = 0;
    }

    const newY = player.y + velocity.y * delta;
    const hit = getCollidingBlock(player.x, newY, player.z);

    if (!hit) {
      player.y = newY;
      onGround = false;
    } else {
      if (velocity.y < 0) {
        onGround = true;
        player.y = hit.y + 0.5 + 0.001;

        while (collides(player.x, player.y, player.z)) {
          player.y += 0.01;
        }
      }

      velocity.y = 0;
    }

    camera.position.set(player.x, player.y + 1.6, player.z);
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;
    camera.rotation.z = 0;
  };

  function clearAllBlocks() {
    blocks.forEach(function (mesh) {
      scene.remove(mesh);
    });

    blocks.clear();
  }

  function removeNonBedrock(x, y, z) {
    const key = blockKey(x, y, z);
    const mesh = blocks.get(key);

    if (!mesh) {
      return;
    }

    if (mesh.userData.type === "bedrock") {
      return;
    }

    scene.remove(mesh);
    blocks.delete(key);
  }

  function replaceBlock(x, y, z, type) {
    removeNonBedrock(x, y, z);
    addBlock(x, y, z, type);
  }

  function getTopBlock(x, z) {
    for (let y = 25; y >= -3; y--) {
      const mesh = blocks.get(blockKey(x, y, z));

      if (
        mesh &&
        mesh.userData.type !== "leaves" &&
        mesh.userData.type !== "water"
      ) {
        return y;
      }
    }

    return null;
  }

  function addTree(x, z) {
    const groundY = getTopBlock(x, z);

    if (groundY === null) {
      return;
    }

    const trunkHeight = 4;
    const topY = groundY + trunkHeight;

    for (let y = 1; y <= trunkHeight; y++) {
      addBlock(x, groundY + y, z, "wood");
    }

    for (let dy = 0; dy <= 2; dy++) {
      const radius = dy === 2 ? 1 : 2;

      for (let dx = -radius; dx <= radius; dx++) {
        for (let dz = -radius; dz <= radius; dz++) {
          if (dy < 2 && dx === 0 && dz === 0) {
            continue;
          }

          if (dy === 2 && Math.abs(dx) + Math.abs(dz) > 1) {
            continue;
          }

          addBlock(x + dx, topY + dy, z + dz, "leaves");
        }
      }
    }
  }

  function addDefaultTrees() {
    const treePositions = [
      [-7, -5],
      [5, 6],
      [-8, 8],
      [8, -8],
      [1, -9],
      [-2, 9],
      [9, 2],
      [-10, -2]
    ];

    treePositions.forEach(function (position) {
      addTree(position[0], position[1]);
    });
  }

  function generateLake(cx, cz, radius) {
    for (let dx = -radius; dx <= radius; dx++) {
      for (let dz = -radius; dz <= radius; dz++) {
        const distance = dx * dx + dz * dz;

        if (distance <= radius * radius) {
          const x = cx + dx;
          const z = cz + dz;

          for (let y = 10; y >= -1; y--) {
            removeNonBedrock(x, y, z);
          }

          addBlock(x, 0, z, "water");
          addBlock(x, -1, z, "water");

          removeNonBedrock(x, -2, z);
          addBlock(x, -2, z, "sand");
        }
      }
    }
  }

  function generateLakes() {
    generateLake(-6, 5, 3);
    generateLake(6, -6, 3);
    generateLake(-2, -8, 2);
  }

  function part5ResetWorld() {
    clearAllBlocks();

    if (typeof generateWorld === "function") {
      generateWorld();
    }

    addDefaultTrees();
    generateLakes();

    player.x = 0;
    player.y = 6;
    player.z = 0;

    velocity.x = 0;
    velocity.y = 0;
    velocity.z = 0;

    yaw = 0;
    pitch = 0;
    onGround = false;

    selectPart5Slot(0);

    showPart5Message("جیهان نوێ کرایەوە");
  }

  generateLakes();
  selectPart5Slot(0);

(function () {

      transform: translateX(-50%);

    }
  `;

  document.head.appendChild(style);

  let part6MessageTimer = null;

  function showPart6Message(text) {

    if (!message) {
      message = document.createElement("div");

    message.style.opacity = "1";

      message.style.opacity = "0";
    }, 2200);
  }

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function createTextureFromCanvas(drawFunction) {
    const canvas = document.createElement("canvas");
    canvas.width = 16;
    canvas.height = 16;

    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    drawFunction(ctx);

    const texture = new THREE.CanvasTexture(canvas);
    texture.magFilter = THREE.NearestFilter;
    texture.minFilter = THREE.NearestFilter;
    texture.generateMipmaps = false;
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;

    return {
      texture: texture,
      dataURL: canvas.toDataURL()
    };
  }

  function fillNoise(ctx, minGray, maxGray) {
    for (let x = 0; x < 16; x++) {
      for (let y = 0; y < 16; y++) {
        const g = randInt(minGray, maxGray);
        ctx.fillStyle = "rgb(" + g + "," + g + "," + g + ")";
        ctx.fillRect(x, y, 1, 1);
      }
    }
  }

  function addSpecks(ctx, count, minGray, maxGray) {
    for (let i = 0; i < count; i++) {
      const x = randInt(0, 15);
      const y = randInt(0, 15);
      const g = randInt(minGray, maxGray);

      ctx.fillStyle = "rgb(" + g + "," + g + "," + g + ")";
      ctx.fillRect(x, y, 1, 1);
    }
  }

  function addCracks(ctx) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.18)";

    for (let i = 0; i < 7; i++) {
      let x = randInt(0, 15);
      let y = randInt(0, 15);
      const steps = randInt(3, 6);

      for (let s = 0; s < steps; s++) {
        ctx.fillRect(x, y, 1, 1);

        x += randInt(-1, 1);
        y += randInt(-1, 1);

        if (x < 0) x = 0;
        if (x > 15) x = 15;

        if (y < 0) y = 0;
        if (y > 15) y = 15;
      }
    }
  }

  function drawGrass(ctx) {
    fillNoise(ctx, 190, 245);
    addSpecks(ctx, 30, 120, 170);
  }

  function drawDirt(ctx) {
    fillNoise(ctx, 170, 225);
    addSpecks(ctx, 40, 100, 160);
  }

  function drawStone(ctx) {
    fillNoise(ctx, 180, 225);
    addCracks(ctx);
    addSpecks(ctx, 18, 130, 170);
  }

  function drawBedrock(ctx) {
    fillNoise(ctx, 45, 110);
    addSpecks(ctx, 30, 10, 40);
  }

  function drawWood(ctx) {
    for (let x = 0; x < 16; x++) {
      const stripe = Math.floor(x / 3) % 2 === 0;

      for (let y = 0; y < 16; y++) {
        let g;

        if (stripe) {
          g = randInt(190, 220);
        } else {
          g = randInt(150, 180);
        }

        if (Math.random() < 0.08) {
          g -= 30;
        }

        ctx.fillStyle = "rgb(" + g + "," + g + "," + g + ")";
        ctx.fillRect(x, y, 1, 1);
      }
    }
  }

  function drawLeaves(ctx) {
    ctx.clearRect(0, 0, 16, 16);

    for (let x = 0; x < 16; x++) {
      for (let y = 0; y < 16; y++) {
        if (Math.random() < 0.82) {
          const g = randInt(180, 255);
          ctx.fillStyle = "rgba(" + g + "," + g + "," + g + ",1)";
          ctx.fillRect(x, y, 1, 1);
        }
      }
    }
  }

  function drawSand(ctx) {
    fillNoise(ctx, 210, 250);
    addSpecks(ctx, 22, 170, 210);
  }

  function drawPlank(ctx) {
    for (let y = 0; y < 16; y++) {
      const plank = Math.floor(y / 4);
      const line = y % 4 === 0;

      for (let x = 0; x < 16; x++) {
        let g;

        if (line) {
          g = randInt(100, 125);
        } else {
          g = plank % 2 === 0 ? randInt(190, 215) : randInt(175, 200);
        }

        if (Math.random() < 0.06) {
          g -= 20;
        }

        ctx.fillStyle = "rgb(" + g + "," + g + "," + g + ")";
        ctx.fillRect(x, y, 1, 1);
      }
    }
  }

  function drawCobble(ctx) {
    fillNoise(ctx, 130, 190);

    ctx.lineWidth = 1;

    for (let i = 0; i < 10; i++) {
      const x = randInt(0, 12);
      const y = randInt(0, 12);
      const w = randInt(2, 4);
      const h = randInt(2, 4);
      const g = randInt(160, 230);

      ctx.fillStyle = "rgb(" + g + "," + g + "," + g + ")";
      ctx.fillRect(x, y, w, h);

      ctx.strokeStyle = "rgba(0, 0, 0, 0.25)";
      ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    }
  }

  function drawGlass(ctx) {
    ctx.clearRect(0, 0, 16, 16);

    ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
    ctx.fillRect(0, 0, 16, 1);
    ctx.fillRect(0, 15, 16, 1);
    ctx.fillRect(0, 0, 1, 16);
    ctx.fillRect(15, 0, 1, 16);

    ctx.fillStyle = "rgba(255, 255, 255, 0.35)";

    for (let i = 0; i < 5; i++) {
      ctx.fillRect(3 + i, 10 - i, 1, 1);
    }

    for (let i = 0; i < 3; i++) {
      ctx.fillRect(9 + i, 5 - i, 1, 1);
    }
  }

  function drawWater(ctx) {
    ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
    ctx.fillRect(0, 0, 16, 16);

    ctx.fillStyle = "rgba(255, 255, 255, 0.45)";

    for (let i = 0; i < 14; i++) {
      const x = randInt(0, 15);
      const y = randInt(0, 15);
      const w = randInt(1, 2);

      ctx.fillRect(x, y, w, 1);
    }
  }

  const textureDataURLs = {};

  function applyTexture(type, drawFunction, color) {
    if (!materials[type]) {
      return;
    }

    const result = createTextureFromCanvas(drawFunction);

    materials[type].map = result.texture;
    materials[type].needsUpdate = true;

    if (color !== undefined) {
      materials[type].color.set(color);
    }

    textureDataURLs[type] = result.dataURL;
  }

  applyTexture("grass", drawGrass, 0x67c955);
  applyTexture("dirt", drawDirt, 0x9b6a3a);
  applyTexture("stone", drawStone, 0x9e9e9e);
  applyTexture("bedrock", drawBedrock, 0x444444);
  applyTexture("wood", drawWood, 0x8a5a25);
  applyTexture("leaves", drawLeaves, 0x3fa33f);
  applyTexture("sand", drawSand, 0xd8c37a);
  applyTexture("plank", drawPlank, 0xb58a4d);
  applyTexture("cobble", drawCobble, 0x8a8a8a);
  applyTexture("glass", drawGlass, 0xbfe8ff);
  applyTexture("water", drawWater, 0x4aa3ff);

  if (materials.leaves) {
    materials.leaves.transparent = true;
    materials.leaves.opacity = 1;
    materials.leaves.alphaTest = 0.15;
    materials.leaves.depthWrite = true;
  }

  if (materials.glass) {
    materials.glass.transparent = true;
    materials.glass.opacity = 0.55;
    materials.glass.depthWrite = false;
  }

  if (materials.water) {
    materials.water.transparent = true;
    materials.water.opacity = 0.7;
    materials.water.depthWrite = false;
  }

  const part6HotbarTypes = [
    "grass",
    "dirt",
    "stone",
    "wood",
    "plank",
    "leaves",
    "sand",
    "cobble",
    "water"
  ];

  function updatePart6HotbarTextures() {
    const hotbar = document.getElementById("part5-hotbar");

    if (!hotbar) {
      return;
    }

    for (
      let i = 0;
      i < part6HotbarTypes.length && i < hotbar.children.length;
      i++
    ) {
      const slot = hotbar.children[i];
      const preview = slot.firstElementChild;

      if (!preview) {
        continue;
      }

      const type = part6HotbarTypes[i];
      const url = textureDataURLs[type];

      if (url) {
        preview.style.background = "url(" + url + ") center / cover";
        preview.style.border = "1px solid rgba(0, 0, 0, 0.25)";
      }
    }
  }

  const part5Hotbar = document.getElementById("part5-hotbar");

  if (part5Hotbar) {
    const hotbarObserver = new MutationObserver(function () {
      updatePart6HotbarTextures();
    });

    hotbarObserver.observe(part5Hotbar, {
      childList: true,
      subtree: true
    });

    updatePart6HotbarTextures();
  }

  const particles = [];
  const particleGeometry = new THREE.BoxGeometry(0.12, 0.12, 0.12);

  function removeParticleByIndex(index) {
    const p = particles[index];

    if (!p) {
      return;
    }

    scene.remove(p.mesh);
    p.mesh.material.dispose();

    particles.splice(index, 1);
  }

  function spawnBreakParticles(targetMesh, type) {
    if (type === "water" || type === "bedrock") {
      return;
    }

    const baseColor =
      materials[type] && materials[type].color
        ? materials[type].color.clone()
        : new THREE.Color(0xffffff);

    const count = 14;

    for (let i = 0; i < count; i++) {
      if (particles.length > 240) {
        removeParticleByIndex(0);
      }

      const material = new THREE.MeshBasicMaterial({
        color: baseColor,
        transparent: true,
        opacity: 0.95
      });

      const mesh = new THREE.Mesh(particleGeometry, material);

      mesh.position.set(
        targetMesh.position.x + (Math.random() - 0.5) * 0.7,
        targetMesh.position.y + (Math.random() - 0.5) * 0.7,
        targetMesh.position.z + (Math.random() - 0.5) * 0.7
      );

      mesh.rotation.set(
        Math.random() * Math.PI,
        Math.random() * Math.PI,
        Math.random() * Math.PI
      );

      scene.add(mesh);

      particles.push({
        mesh: mesh,
        velocity: new THREE.Vector3(
          (Math.random() - 0.5) * 3.2,
          Math.random() * 3 + 1,
          (Math.random() - 0.5) * 3.2
        ),
        life: 0.65 + Math.random() * 0.45,
        maxLife: 1.1
      });
    }
  }

  window.addEventListener(
    "mousedown",
    function (event) {
      if (document.pointerLockElement !== document.body) {
        return;
      }

      if (event.button !== 0) {
        return;
      }

      if (typeof raycastBlocks !== "function") {
        return;
      }

      const intersects = raycastBlocks();

      if (intersects.length === 0) {
        return;
      }

      const hit = intersects[0];
      const data = hit.object.userData;

      if (!data) {
        return;
      }

      spawnBreakParticles(hit.object, data.type);
    },
    true
  );

  function updateParticles(delta) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];

      p.life -= delta;

      if (p.life <= 0 || p.mesh.position.y < -20) {
        scene.remove(p.mesh);
        p.mesh.material.dispose();
        particles.splice(i, 1);
        continue;
      }

      p.velocity.y -= 14 * delta;

      p.mesh.position.addScaledVector(p.velocity, delta);

      p.mesh.rotation.x += delta * 3;
      p.mesh.rotation.y += delta * 2;

      const t = Math.max(0, p.life / p.maxLife);

      p.mesh.material.opacity = t;
      p.mesh.scale.setScalar(Math.max(0.15, t));
    }
  }

  const part6Clock = new THREE.Clock();

  function part6Loop() {
    requestAnimationFrame(part6Loop);

    const delta = Math.min(part6Clock.getDelta(), 0.05);

    if (materials.water && materials.water.map) {
      materials.water.map.offset.x += delta * 0.05;
      materials.water.map.offset.y += delta * 0.03;
    }

    updateParticles(delta);
  }

  part6Loop();

  showPart6Message("Part 6: تێکسچەر و پارتیکل زیادکران");
})();

  function initAudio() {
    if (audioCtx) {
      if (audioCtx.state === "suspended") {
        audioCtx.resume();

        window.AudioContext || window.webkitAudioContext;

      if (!AudioContextClass) {
        return;

      audioCtx = new AudioContextClass();

      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.35;

      lowpass = audioCtx.createBiquadFilter();
      lowpass.type = "lowpass";
      lowpass.frequency.value = 18000;

      masterGain.connect(lowpass);
      lowpass.connect(audioCtx.destination);

      noiseBuffer = createNoiseBuffer();

      startAmbient();

      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    } catch (error) {
      audioCtx = null;

    const bufferSize = audioCtx.sampleRate * 1;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);

    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }

    return buffer;
  }

    if (!audioCtx || ambientStarted) {
      return;
    }

    const source = audioCtx.createBufferSource();
    source.buffer = noiseBuffer;
    source.loop = true;

    const filter = audioCtx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 220;

    const gain = audioCtx.createGain();
    gain.gain.value = 0.015;

    source.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);

    source.start();

      return;

    gainValue = Math.max(0.001, gainValue);

    filter.frequency.value = filterFreq;

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(gainValue, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    source.start(now);

    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, now);

    if (slideTo) {
      osc.frequency.exponentialRampToValueAtTime(

        now + duration
      );
    }

    gain.gain.setValueAtTime(gainValue, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    osc.connect(gain);
    gain.connect(masterGain);

    osc.start(now);
    osc.stop(now + duration + 0.03);

  function playBreakSound(type) {

      case "cobble":
      case "bedrock":

      return;
    }

    intensity = clamp(intensity || 0.5, 0, 1);

    playNoise(
      0.35,
      900,
      0.22 * intensity + 0.08,
      rand(0.8, 1.0),
      "lowpass"
    );

    playNoise(
      0.2,
      2000,
      0.12 * intensity + 0.04,
      rand(1.1, 1.35),
      "highpass"
    );
  }

  function playHurtSound() {
    if (!audioCtx || muted) {
      return;
    }

    playTone(rand(200, 240), 0.18, 0.22, "sawtooth", 110);
    playNoise(0.12, 700, 0.15, rand(0.8, 1.0), "lowpass");
  }

  function playDeathSound() {
    if (!audioCtx || muted) {
      return;
    }

    playTone(160, 0.5, 0.25, "sawtooth", 60);
    playNoise(0.4, 500, 0.18, 0.7, "lowpass");
  }

  let health = 20;
  let part7Dead = false;
  let damageTimer = null;

  const hearts = document.createElement("div");
  hearts.id = "part7-hearts";
  document.body.appendChild(hearts);

  const damageOverlay = document.createElement("div");
  damageOverlay.id = "part7-damage";
  document.body.appendChild(damageOverlay);

  const deathOverlay = document.createElement("div");
  deathOverlay.id = "part7-death";
  deathOverlay.innerHTML =
    "<h1>تۆ مردیت</h1><p>کلیک بکە بۆ گەڕانەوە</p>";
  document.body.appendChild(deathOverlay);

  function updateHearts() {
    hearts.innerHTML = "";

    for (let i = 0; i < 10; i++) {
      const heart = document.createElement("span");
      heart.textContent = "❤";

      if (i < Math.ceil(health / 2)) {
        heart.className = "part7-heart-full";
      } else {
        heart.className = "part7-heart-empty";
      }

      hearts.appendChild(heart);
    }
  }

  function flashDamage() {
    damageOverlay.style.opacity = "0.35";

    clearTimeout(damageTimer);

    damageTimer = setTimeout(function () {
      damageOverlay.style.opacity = "0";
    }, 140);
  }

  function damagePlayer(amount) {
    if (part7Dead || amount <= 0) {
      return;
    }

    health -= amount;

    if (health < 0) {
      health = 0;
    }

    flashDamage();
    updateHearts();
    playHurtSound();

    if (health <= 0) {
      die();
    }
  }

  function die() {
    part7Dead = true;

    velocity.x = 0;
    velocity.y = 0;
    velocity.z = 0;

    deathOverlay.style.display = "flex";

    playDeathSound();

    if (document.pointerLockElement === document.body) {
      document.exitPointerLock();
    }
  }

  function respawn() {
    part7Dead = false;
    health = 20;

    player.x = 0;
    player.y = 6;
    player.z = 0;

    velocity.x = 0;
    velocity.y = 0;
    velocity.z = 0;

    yaw = 0;
    pitch = 0;

    deathOverlay.style.display = "none";

    updateHearts();
    resetFallVars();

    if (document.pointerLockElement !== document.body) {
      document.body.requestPointerLock();
    }
  }

  deathOverlay.addEventListener("click", respawn);

  const previousUpdatePlayer =
    typeof updatePlayer === "function" ? updatePlayer : null;

  updatePlayer = function (delta) {
    if (part7Dead) {
      velocity.x = 0;
      velocity.y = 0;
      velocity.z = 0;
      return;
    }

    if (previousUpdatePlayer) {
      previousUpdatePlayer(delta);
    }
  };

  function getBlockAtPoint(x, y, z) {
    const bx = Math.floor(x + 0.5);
    const by = Math.floor(y + 0.5);
    const bz = Math.floor(z + 0.5);

    const mesh = blocks.get(blockKey(bx, by, bz));

    if (!mesh) {
      return null;
    }

    return mesh.userData.type;
  }

  function getBlockUnderPlayer() {
    const x = Math.floor(player.x + 0.5);
    const z = Math.floor(player.z + 0.5);
    const y = Math.floor(player.y + 0.5) - 1;

    const mesh = blocks.get(blockKey(x, y, z));

    if (!mesh) {
      return null;
    }

    return mesh.userData.type;
  }

  function isPlayerBodyInWater() {
    return (
      getBlockAtPoint(player.x, player.y + 0.2, player.z) === "water" ||
      getBlockAtPoint(player.x, player.y + 0.9, player.z) === "water" ||
      getBlockAtPoint(player.x, player.y + 1.5, player.z) === "water"
    );
  }

  function isEyeInWaterPart7() {
    return (
      getBlockAtPoint(
        camera.position.x,
        camera.position.y,
        camera.position.z
      ) === "water"
    );
  }

  window.addEventListener(
    "mousedown",
    function (event) {
      initAudio();

      if (!audioCtx || muted) {
        return;
      }

      if (document.pointerLockElement !== document.body) {
        return;
      }

      if (event.button === 0) {
        if (typeof raycastBlocks !== "function") {
          return;
        }

        const intersects = raycastBlocks();

        if (intersects.length > 0) {
          const type = intersects[0].object.userData.type;

          if (type !== "water" && type !== "bedrock") {
            playBreakSound(type);
          }
        }
      }

      if (event.button === 2) {
        if (typeof raycastBlocks === "function") {
          const intersects = raycastBlocks();

          if (intersects.length > 0) {
            playPlaceSound(currentBlock);
          }
        }
      }
    },
    true
  );

  window.addEventListener(
    "keydown",
    function (event) {
      initAudio();

      if (event.code === "KeyM") {
        muted = !muted;

        if (masterGain) {
          masterGain.gain.value = muted ? 0 : 0.35;
        }

        showPart7Message(
          muted ? "دەنگ کوژایەوە" : "دەنگ چالاک کرا"
        );
      }
    },
    true
  );

  let lastX = player.x;
  let lastZ = player.z;
  let stepDistance = 0;
  let wasInWater = isPlayerBodyInWater();
  let wasOnGround = true;
  let fallStartY = player.y;

  function resetFallVars() {
    lastX = player.x;
    lastZ = player.z;
    stepDistance = 0;
    wasInWater = isPlayerBodyInWater();
    wasOnGround = true;
    fallStartY = player.y;
  }

  const part7Clock = new THREE.Clock();

  function part7Loop() {
    requestAnimationFrame(part7Loop);

    const delta = Math.min(part7Clock.getDelta(), 0.05);

    if (!part7Dead) {
      const inWater = isPlayerBodyInWater();

      if (inWater && !wasInWater) {
        playSplash(Math.abs(velocity.y) > 3 ? 1 : 0.45);
      }

      wasInWater = inWater;

      if (onGround || inWater) {
        if (!wasOnGround) {
          const fallDistance = fallStartY - player.y;

          if (!inWater && fallDistance > 4) {
            damagePlayer(Math.floor(fallDistance - 3));
          }
        }

        wasOnGround = true;
        fallStartY = player.y;
      } else {
        if (wasOnGround) {
          fallStartY = player.y;
          wasOnGround = false;
        }

        if (player.y > fallStartY) {
          fallStartY = player.y;
        }
      }

      if (player.y < -25) {
        damagePlayer(100);
      }

      const dx = player.x - lastX;
      const dz = player.z - lastZ;
      const dist = Math.sqrt(dx * dx + dz * dz);

      lastX = player.x;
      lastZ = player.z;

      if (onGround && !inWater && dist > 0.0001) {
        stepDistance += dist;

        if (stepDistance > 0.62) {
          playFootstepSound(getBlockUnderPlayer());
          stepDistance = 0;
        }
      } else {
        stepDistance = 0;
      }
    }

    if (audioCtx && lowpass && masterGain) {
      const eyeWater = isEyeInWaterPart7();

      if (eyeWater) {
        lowpass.frequency.setTargetAtTime(
          480,
          audioCtx.currentTime,
          0.08
        );

        if (!muted) {
          masterGain.gain.setTargetAtTime(
            0.22,
            audioCtx.currentTime,
            0.08
          );
        }
      } else {
        lowpass.frequency.setTargetAtTime(
          18000,
          audioCtx.currentTime,
          0.08
        );

        if (!muted) {
          masterGain.gain.setTargetAtTime(
            0.35,
            audioCtx.currentTime,
            0.08
          );
        }
      }
    }
  }

  updateHearts();
  part7Loop();

  showPart7Message(
    "Part 7: دەنگ، زیان و مردن زیادکران — M = دەنگ"
  );
})();

<script>
(function () {
  if (typeof scene === "undefined" || typeof blocks === "undefined") {

  }

  if (window.__minicraftPart8Loaded) {

  window.__minicraftPart8Loaded = true;

  const style = document.createElement("style");
  style.textContent = `

      position: fixed;

      left: 50%;

    }

      position: relative;
    }

    .part8-count {
      position: absolute;
      bottom: 2px;

  document.head.appendChild(style);

  function showPart8Message(text) {
    let message = document.getElementById("mc-message");

    if (!message) {
      message = document.createElement("div");
      message.id = "mc-message";
      document.body.appendChild(message);
    }

    message.innerText = text;
    message.style.opacity = "1";

    clearTimeout(part8MessageTimer);

    part8MessageTimer = setTimeout(function () {
      message.style.opacity = "0";
    }, 2200);
  }

  function part8Rand(min, max) {
    return Math.random() * (max - min) + min;
  }

  const part8HotbarTypes = [
    "grass",
    "dirt",
    "stone",
    "wood",
    "plank",
    "leaves",
    "sand",
    "cobble",
    "water"
  ];

  const counts = {
    grass: 0,
    dirt: 10,
    stone: 10,
    wood: 5,
    plank: 5,
    leaves: 5,
    sand: 5,
    cobble: 10,
    glass: 5,
    water: 5
  };

  function addCount(type, amount) {
    if (!counts[type]) {
      counts[type] = 0;
    }

    counts[type] += amount;

    updatePart8HotbarCounts();
  }

  function getDropType(type) {
    if (type === "bedrock" || type === "water") {
      return null;
    }

    if (type === "stone") {
      return "cobble";
    }

    return type;
  }

  function updatePart8HotbarCounts() {
    const hotbar = document.getElementById("part5-hotbar");

    if (!hotbar) {
      return;
    }

    for (
      let i = 0;
      i < part8HotbarTypes.length && i < hotbar.children.length;
      i++
    ) {
      const slot = hotbar.children[i];

      if (!slot) {
        continue;
      }

      let badge = slot.querySelector(".part8-count");

      if (!badge) {
        badge = document.createElement("div");
        badge.className = "part8-count";
        slot.appendChild(badge);
      }

      const type = part8HotbarTypes[i];

      badge.innerText = counts[type] || 0;
    }
  }

  const part5Hotbar = document.getElementById("part5-hotbar");

  if (part5Hotbar) {
    const hotbarObserver = new MutationObserver(function () {
      updatePart8HotbarCounts();
    });

    hotbarObserver.observe(part5Hotbar, {
      childList: true
    });
  }

  const drops = [];
  const dropGeometry = new THREE.BoxGeometry(0.25, 0.25, 0.25);

  function isSolidBlockAt(bx, by, bz) {
    const mesh = blocks.get(blockKey(bx, by, bz));

    return mesh && mesh.userData.type !== "water";
  }

  function isSolidAtPoint(x, y, z) {
    const bx = Math.floor(x + 0.5);
    const by = Math.floor(y + 0.5);
    const bz = Math.floor(z + 0.5);

    return isSolidBlockAt(bx, by, bz);
  }

  function isPointWater(x, y, z) {
    const bx = Math.floor(x + 0.5);
    const by = Math.floor(y + 0.5);
    const bz = Math.floor(z + 0.5);

    const mesh = blocks.get(blockKey(bx, by, bz));

    return mesh && mesh.userData.type === "water";
  }

  function getItemGroundY(x, y, z) {
    const bx = Math.floor(x + 0.5);
    const bz = Math.floor(z + 0.5);
    const startBy = Math.floor(y + 0.5);

    for (let by = startBy; by >= startBy - 2; by--) {
      if (isSolidBlockAt(bx, by, bz)) {
        return by + 0.5 + 0.125;
      }
    }

    return null;
  }

  function removeDrop(index) {
    const drop = drops[index];

    if (!drop) {
      return;
    }

    scene.remove(drop.mesh);
    drops.splice(index, 1);
  }

  function spawnDrop(type, position) {
    const dropType = getDropType(type);

    if (!dropType) {
      return;
    }

    if (drops.length > 120) {
      removeDrop(0);
    }

    const material = materials[dropType] || materials.stone;

    const mesh = new THREE.Mesh(dropGeometry, material);

    mesh.position.copy(position);
    mesh.position.y -= 0.15;

    scene.add(mesh);

    drops.push({
      mesh: mesh,
      type: dropType,
      velocity: new THREE.Vector3(
        part8Rand(-1, 1),
        part8Rand(1, 2.5),
        part8Rand(-1, 1)
      ),
      life: 30,
      pickupDelay: 0.35
    });
  }

  function isPart7Dead() {
    const deathOverlay = document.getElementById("part7-death");

    return deathOverlay && deathOverlay.style.display === "flex";
  }

  window.addEventListener(
    "mousedown",
    function (event) {
      if (isPart7Dead()) {
        return;
      }

      if (document.pointerLockElement !== document.body) {
        return;
      }

      if (event.button !== 0) {
        return;
      }

      if (typeof raycastBlocks !== "function") {
        return;
      }

      const intersects = raycastBlocks();

      if (intersects.length === 0) {
        return;
      }

      const data = intersects[0].object.userData;

      if (!data) {
        return;
      }

      if (data.type === "water" || data.type === "bedrock") {
        return;
      }

      spawnDrop(data.type, intersects[0].object.position);
    },
    true
  );

  let lastNoBlockMessage = 0;

  window.addEventListener(
    "mousedown",
    function (event) {
      if (isPart7Dead()) {
        return;
      }

      if (document.pointerLockElement !== document.body) {
        return;
      }

      if (event.button !== 2) {
        return;
      }

      if (typeof raycastBlocks !== "function") {
        return;
      }

      const type = currentBlock || "grass";
      const count = counts[type] || 0;

      const intersects = raycastBlocks();

      if (intersects.length === 0) {
        return;
      }

      if (count <= 0) {
        event.stopImmediatePropagation();
        event.preventDefault();

        const now = Date.now();

        if (now - lastNoBlockMessage > 900) {
          showPart8Message("هیچ بلۆکت نییە");
          lastNoBlockMessage = now;
        }

        return;
      }

      const hit = intersects[0];
      const block = hit.object.userData;

      if (!block) {
        return;
      }

      const normal = hit.face.normal;

      if (!normal) {
        return;
      }

      const x = block.x + Math.round(normal.x);
      const y = block.y + Math.round(normal.y);
      const z = block.z + Math.round(normal.z);

      const key = blockKey(x, y, z);

      if (blocks.has(key)) {
        event.stopImmediatePropagation();
        event.preventDefault();
        return;
      }

      if (
        typeof blockIntersectsPlayer === "function" &&
        blockIntersectsPlayer(x, y, z)
      ) {
        event.stopImmediatePropagation();
        event.preventDefault();
        return;
      }

      counts[type] = count - 1;
      updatePart8HotbarCounts();
    },
    true
  );

  function updateDrops(delta) {
    for (let i = drops.length - 1; i >= 0; i--) {
      const item = drops[i];

      item.life -= delta;
      item.pickupDelay -= delta;

      if (item.life <= 0 || item.mesh.position.y < -30) {
        removeDrop(i);
        continue;
      }

      item.mesh.rotation.y += delta * 2.5;

      const inWater = isPointWater(
        item.mesh.position.x,
        item.mesh.position.y,
        item.mesh.position.z
      );

      if (inWater) {
        item.velocity.y += 12 * delta;

        if (item.velocity.y > 1.5) {
          item.velocity.y = 1.5;
        }

        item.velocity.x *= 0.95;
        item.velocity.z *= 0.95;
      } else {
        item.velocity.y -= 16 * delta;
      }

      let newX = item.mesh.position.x + item.velocity.x * delta;
      let newZ = item.mesh.position.z + item.velocity.z * delta;

      if (
        !isSolidAtPoint(newX, item.mesh.position.y, item.mesh.position.z)
      ) {
        item.mesh.position.x = newX;
      } else {
        item.velocity.x = 0;
      }

      if (
        !isSolidAtPoint(item.mesh.position.x, item.mesh.position.y, newZ)
      ) {
        item.mesh.position.z = newZ;
      } else {
        item.velocity.z = 0;
      }

      let newY = item.mesh.position.y + item.velocity.y * delta;

      const groundY = getItemGroundY(
        item.mesh.position.x,
        newY,
        item.mesh.position.z
      );

      if (
        groundY !== null &&
        newY <= groundY &&
        item.velocity.y <= 0
      ) {
        item.mesh.position.y = groundY;
        item.velocity.y = 0;
        item.velocity.x *= 0.8;
        item.velocity.z *= 0.8;
      } else {
        item.mesh.position.y = newY;
      }

      if (item.pickupDelay <= 0) {
        const dx = item.mesh.position.x - player.x;
        const dy = item.mesh.position.y - (player.y + 0.9);
        const dz = item.mesh.position.z - player.z;

        const distSq = dx * dx + dy * dy + dz * dz;

        if (distSq < 1.7) {
          addCount(item.type, 1);
          removeDrop(i);
          continue;
        }

        if (distSq < 9) {
          item.velocity.x += (player.x - item.mesh.position.x) * delta * 4;
          item.velocity.z += (player.z - item.mesh.position.z) * delta * 4;
        }
      }
    }
  }

  const part8Clock = new THREE.Clock();

  function part8Loop() {
    requestAnimationFrame(part8Loop);

    const delta = Math.min(part8Clock.getDelta(), 0.05);

    updateDrops(delta);
  }

  updatePart8HotbarCounts();
  part8Loop();

  showPart8Message(
    "Part 8: ئایتم درۆپ و ئینڤێنتۆری زیادکرا"
  );
})();
</script>
